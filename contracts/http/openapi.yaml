        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    ServiceMTLS:
      type: mutualTLS
      description: >
        Internal service identity from a trusted platform CA. Authorization is
        based on a strict SPIFFE URI from the verified certificate chain and
        per-endpoint allowed identities.
    ProvisioningMTLS:
      type: mutualTLS
      description: >
        Internal mTLS identity restricted to provisioning-service for fetching
        sensitive credential material from access-service.
    NodeAgentMTLS:
      type: mutualTLS
      description: >
        Private management-plane mTLS. The client must be provisioning-service,
        and provisioning-service additionally verifies the exact registered
        node SPIFFE URI in the server's verified certificate chain.
    AdminMTLS:
      type: mutualTLS
      description: >
        Admin CLI/client mTLS identity mapped to RBAC roles and audited actions.
    TelegramWebhookSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: Telegram webhook secret token configured through Bot API setWebhook.
    SubscriptionUrlBearer:
      type: http
      scheme: bearer
      bearerFormat: URL path token
      description: >
        Bearer-secret semantics for `GET /s/{token}`. Happ v1 carries this
        token in the path, not in the Authorization header.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credential_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
  responses:
    Error:
      description: Safe error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Idempotency conflict or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AdminAction:
      description: Typed administrative action, including recoverable processing or unknown outcome state
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminAction'}
    AdminActionConflict:
      description: Idempotency conflict or an existing action attempt with an active lease
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/AdminActionProblem'
    AdminActionFailure:
      description: Definitive owner rejection or an indeterminate owner outcome that remains recoverable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminActionProblem'}
  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 128
        message:
          type: string
          maxLength: 512
        request_id:
          type: string
          maxLength: 128
        fields:
          type: array
          items:
            type: object
            required: [field, code]
            additionalProperties: false
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    UserIdentity:
      type: object
      required: [user_id, status]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, blocked, deleted]
        locale:
          type: [string, 'null']
          maxLength: 32
        timezone:
          type: [string, 'null']
          maxLength: 64
    TelegramIdentityUpsertRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: [string, 'null']
          maxLength: 64
        display_name:
          type: [string, 'null']
          maxLength: 256
        language_code:
          type: [string, 'null']
          maxLength: 16
        locale:
          type: [string, 'null']
          maxLength: 32
    AcceptConsentRequest:
      type: object
      required: [document_type, document_version]
      additionalProperties: false
      properties:
        document_type:
          type: string
          minLength: 1
          maxLength: 64
        document_version:
          type: string
          minLength: 1
          maxLength: 64
    ConsentStatus:
      type: object
      required: [accepted]
      additionalProperties: false
      properties:
        accepted:
          type: boolean
    PlanSummary:
      type: object
      required: [plan_id, name, duration_days, grace_period_hours, currency, amount_minor, region_policy, traffic_policy, primary_nodes, failover_nodes, regions]
      additionalProperties: false
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 128
        duration_days:
          type: integer
          minimum: 1
          maximum: 366
        grace_period_hours:
          type: integer
          minimum: 0
          maximum: 168
        currency:
          type: string
          minLength: 3
          maxLength: 3
        amount_minor:
          type: integer
          minimum: 0
        region_policy:
          type: string
          enum: [single_region_with_failover]
        traffic_policy:
          type: string
          enum: [no_hard_cap]
        primary_nodes:
          type: integer
          minimum: 1
        failover_nodes:
          type: integer
          minimum: 0
        regions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 2
            maxLength: 64
    PlanSnapshot:
      type: object
      required: [plan_id, name, duration_days, grace_period_hours, amount_minor, currency, region, region_policy, traffic_policy, primary_nodes, failover_nodes]
      additionalProperties: false
      properties:
        plan_id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 128
        duration_days:
          type: integer
          minimum: 1
          maximum: 366
        grace_period_hours:
          type: integer
          minimum: 0
          maximum: 168
        amount_minor:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        region:
          type: string
          minLength: 2
          maxLength: 64
        region_policy:
          type: string
          enum: [single_region_with_failover]
        traffic_policy:
          type: string
          enum: [no_hard_cap]
        primary_nodes:
          type: integer
          minimum: 1
        failover_nodes:
          type: integer
          minimum: 0
    CreateOrderRequest:
      type: object
      required: [plan_id, region, accepted_terms_version]
      additionalProperties: false
      properties:
        plan_id:
          type: string
          maxLength: 128
        region:
          type: string
          minLength: 2
          maxLength: 64
        accepted_terms_version:
          type: string
          minLength: 1
          maxLength: 64
    Order:
      type: object
      required: [order_id, user_id, status, amount_minor, currency, accepted_terms_version, plan_snapshot, created_at]
      additionalProperties: false
      properties:
        order_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [created, payment_pending, paid, canceled]
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        accepted_terms_version:
          type: string
          minLength: 1
          maxLength: 64
        plan_snapshot:
          $ref: '#/components/schemas/PlanSnapshot'
        created_at:
          type: string
          format: date-time
    Payment:
      type: object
      required: [payment_id, order_id, status, amount_minor, currency, created_at]
      additionalProperties: false
      properties:
        payment_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [created, verification_pending, pending, succeeded, canceled, failed]
        amount_minor:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        confirmation_url:
          type: string
          format: uri
          description: Sensitive enough to avoid logs.
        paid_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    Subscription:
      type: object
      required: [subscription_id, user_id, status]
      additionalProperties: false
      properties:
        subscription_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, active, grace, expired, suspended, revoked]
        current_period_start:
          type: [string, 'null']
          format: date-time
        current_period_end:
          type: [string, 'null']
          format: date-time
        grace_ends_at:
          type: [string, 'null']
          format: date-time
    AccessStatus:
      type: object
      required: [subscription_id, credential_id, access_status, provisioning_status, token_status]
      additionalProperties: false
      properties:
        subscription_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        access_status:
          type: string
          enum: [pending, ready, active, expired, revoking, revoked, failed]
          description: "`ready` means VPN is provisioned, entitlement time remains, and a URL may be issued."
        provisioning_status:
          type: string
          enum: [provisioning, active, degraded, failed, revoking, revoked]
        token_status:
          type: string
          enum: [not_issued, active, rotated, revoked, expired]
    SubscriptionUrlIssued:
      type: object
      required: [subscription_url]
      additionalProperties: false
      properties:
        subscription_url:
          type: string
          format: uri
          description: Returned only at issuance or rotation. Must not be logged or persisted by caller.
    ProvisioningCredentialMaterial:
      type: object
      required: [credential_id, subscription_id, revision, protocol, vless_client_uuid]
      additionalProperties: false
      properties:
        credential_id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        protocol:
          type: string
          enum: [vless_reality]
        vless_client_uuid:
          type: string
          format: uuid
          description: Sensitive VPN credential. Must be encrypted at rest and never logged.
    SubscriptionPlacement:
      type: object
      required: [subscription_id, period_id, region, primary_nodes, failover_nodes, valid_until]
      additionalProperties: false
      properties:
        subscription_id:
          type: string
          format: uuid
        period_id:
          type: string
          format: uuid
        region:
          type: string
          minLength: 2
          maxLength: 64
        primary_nodes:
          type: integer
          const: 1
        failover_nodes:
          type: integer
          const: 1
        valid_until:
          type: string
          format: date-time
    NodeDesiredState:
      type: object
      required: [operation_id, credential_id, desired_revision, state]
      additionalProperties: false
      oneOf:
        - properties:
            state:
              const: present
          required: [protocol, vless_client_uuid]
        - properties:
            state:
              const: absent
          not:
            anyOf:
              - properties:
                  protocol:
                    type: string
                required: [protocol]
              - properties:
                  vless_client_uuid:
                    type: string
                required: [vless_client_uuid]
      properties:
        operation_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        desired_revision:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [present, absent]
        protocol:
          type: string
          enum: [vless_reality]
        vless_client_uuid:
          type: string
          format: uuid
          description: Required only for present state; sensitive and never logged or journaled in plaintext.
    NodeApplyResult:
      type: object
      required: [operation_id, credential_id, desired_revision, state, config_revision, applied_at]
      additionalProperties: false
      properties:
        operation_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        desired_revision:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [present, absent]
        config_revision:
          type: integer
          minimum: 1
        applied_at:
          type: string
          format: date-time
    NodeCredentialState:
      type: object
      required: [credential_id, desired_revision, state, config_revision]
      additionalProperties: false
      properties:
        credential_id:
          type: string
          format: uuid
        desired_revision:
          type: integer
          minimum: 0
        state:
          type: string
          enum: [present, absent]
        config_revision:
          type: integer
          minimum: 0
    NodeAgentStatus:
      type: object
      required: [node_id, config_revision, active_clients, xray_healthy, agent_version, xray_version]
      additionalProperties: false
      properties:
        node_id:
          type: string
          format: uuid
        config_revision:
          type: integer
          minimum: 0
        active_clients:
          type: integer
          minimum: 0
        xray_healthy:
          type: boolean
        agent_version:
          type: string
          maxLength: 64
        xray_version:
          type: string
          maxLength: 64
    AdminReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 512
    AdminRevokeRequest:
      type: object
      required: [reason, reason_code]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 3, maxLength: 512}
        reason_code: {type: string, enum: [admin_block, abuse, deleted]}
    OwnerRevokeRequest:
      type: object
      required: [action_id, correlation_id, reason_code]
      additionalProperties: false
      properties:
        action_id: {type: string, format: uuid}
        correlation_id: {type: string, format: uuid}
        reason_code: {type: string, enum: [admin_block, abuse, deleted]}
    OwnerRecoveryRequest:
      type: object
      required: [action_id, correlation_id]
      additionalProperties: false
      properties:
        action_id: {type: string, format: uuid}
        correlation_id: {type: string, format: uuid}
    NotificationTarget:
      type: object
      required: [eligible]
      additionalProperties: false
      properties:
        eligible: {type: boolean}
        reason_code: {type: string, maxLength: 64}
        telegram_chat_id: {type: integer, format: int64, minimum: 1, writeOnly: true}
        locale: {type: string, maxLength: 32}
    PaymentStatus:
      type: object
      required: [payment_id, order_id, status, amount_minor, currency, created_at]
      additionalProperties: false
      properties:
        payment_id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        status: {type: string, enum: [created, verification_pending, pending, succeeded, canceled, failed]}
        amount_minor: {type: integer, format: int64, minimum: 1}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        paid_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    NotificationJob:
      type: object
      required: [notification_id, user_id, notification_type, template_version, status, attempts, max_attempts, next_attempt_at, correlation_id, created_at, updated_at]
      additionalProperties: false
      properties:
        notification_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        subscription_id: {type: string, format: uuid}
        credential_id: {type: string, format: uuid}
        notification_type: {type: string, pattern: '^[a-z][a-z0-9_]{2,63}$'}
        template_version: {type: integer, minimum: 1}
        status: {type: string, enum: [pending, processing, retry, delivered, permanently_failed, suppressed]}
        attempts: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1, maximum: 100}
        next_attempt_at: {type: string, format: date-time}
        correlation_id: {type: string, format: uuid}
        causation_id: {type: string, format: uuid}
        terminal_reason_code: {type: string, maxLength: 64}
        delivered_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NotificationRetryResult:
      type: object
      required: [notification, replay]
      additionalProperties: false
      properties:
        notification:
          type: object
          required: [notification_id, notification_type, status, attempts, max_attempts]
          additionalProperties: false
          properties:
            notification_id: {type: string, format: uuid}
            notification_type: {type: string}
            status: {type: string}
            attempts: {type: integer, minimum: 0}
            max_attempts: {type: integer, minimum: 1}
        replay: {type: boolean}
    NotificationDeadLetterList:
      type: object
      required: [dead_letters]
      additionalProperties: false
      properties:
        dead_letters:
          type: array
          items: {$ref: '#/components/schemas/NotificationDeadLetter'}
    NotificationDeadLetter:
      type: object
      required: [source_topic, source_partition, source_offset, payload_sha256, reason_code, state, created_at, updated_at]
      additionalProperties: false
      properties:
        source_topic: {type: string, maxLength: 249}
        source_partition: {type: integer, minimum: 0}
        source_offset: {type: integer, format: int64, minimum: 0}
        payload_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        event_type: {type: string, maxLength: 128}
        reason_code: {type: string, maxLength: 64}
        state: {type: string, enum: [available, replay_requested, replayed]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TelegramDeliveryRequest:
      type: object
      required: [telegram_chat_id, notification_type, template_version, text]
      additionalProperties: false
      properties:
        telegram_chat_id: {type: integer, format: int64, minimum: 1, writeOnly: true}
        notification_type: {type: string, pattern: '^[a-z][a-z0-9_]{2,63}$'}
        template_version: {type: integer, const: 1}
        text: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
    TelegramDeliveryResult:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: {type: string, enum: [delivered, replay, retryable, permanent]}
        reason_code: {type: string, maxLength: 64}
        retry_after_seconds: {type: integer, minimum: 0}
    SubscriptionRevokeResult:
      type: object
      required: [subscription_id, status, reason_code, replay]
      additionalProperties: false
      properties:
        subscription_id: {type: string, format: uuid}
        status: {const: revoked}
        reason_code: {type: string, enum: [admin_block, abuse, deleted]}
        replay: {type: boolean}
    AccessRecoveryResult:
      type: object
      required: [credential_id, operation_id, desired_revision, status, replay]
      additionalProperties: false
      properties:
        credential_id: {type: string, format: uuid}
        operation_id: {type: string, format: uuid}
        desired_revision: {type: integer, minimum: 2}
        status: {const: provisioning}
        replay: {type: boolean}
    ProvisioningSupportStatus:
      type: object
      required: [credential_id, operation_id, kind, desired_revision, state, attempts, max_attempts, created_at, allocations]
      additionalProperties: false
      properties:
        credential_id: {type: string, format: uuid}
        operation_id: {type: string, format: uuid}
        kind: {type: string, enum: [provision, revoke]}
        desired_revision: {type: integer, minimum: 1}
        state: {type: string, enum: [pending, processing, retry, succeeded, failed]}
        attempts: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1}
        last_error_code: {type: string, maxLength: 64}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        allocations:
          type: array
          items:
            type: object
            required: [node_id, node_label, region, node_status, role, desired_revision, desired_state, allocation_revision, state]
            additionalProperties: false
            properties:
              node_id: {type: string, format: uuid}
              node_label: {type: string, maxLength: 64}
              region: {type: string, maxLength: 64}
              node_status: {type: string, enum: [active, draining, offline]}
              role: {type: string, enum: [primary, failover]}
              desired_revision: {type: integer, minimum: 1}
              desired_state: {type: string, enum: [present, absent]}
              allocation_revision: {type: integer, minimum: 1}
              state: {type: string, enum: [pending, active, failed, revoked]}
              last_error_code: {type: string, maxLength: 64}
    AdminAction:
      type: object
      required: [action_id, action, target_type, target_id, status, correlation_id, created_at, replay]
      additionalProperties: false
      properties:
        action_id: {type: string, format: uuid}
        action: {type: string, enum: [notification.retry, subscription.revoke, access.provisioning.recover]}
        target_type: {type: string, enum: [notification, subscription, credential]}
        target_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, processing, outcome_unknown, succeeded, failed]}
        result:
          oneOf:
            - $ref: '#/components/schemas/NotificationRetryResult'
            - $ref: '#/components/schemas/SubscriptionRevokeResult'
            - $ref: '#/components/schemas/AccessRecoveryResult'
        error_code: {type: string, maxLength: 64}
        correlation_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        replay: {type: boolean}
    AdminActionProblem:
      type: object
      required: [action, error_code]
      additionalProperties: false
      properties:
        action: {$ref: '#/components/schemas/AdminAction'}
        error_code:
          type: string
          enum: [action_in_progress, owner_outcome_unknown, owner_operation_rejected, owner_operation_failed]
    AdminAuditList:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          items: {$ref: '#/components/schemas/AdminAuditEvent'}
    AdminHealthSummary:
      type: object
      required: [services]
      additionalProperties: false
      properties:
        services:
          type: array
          items:
            type: object
            required: [service, status]
            additionalProperties: false
            properties:
              service:
                type: string
                enum: [access-service, billing-service, identity-service, notification-service, provisioning-service, subscription-service]
              status: {type: string, enum: [ready, unavailable]}
              version: {type: string, maxLength: 128}
    AdminAuditEvent:
      type: object
      required: [audit_event_id, action_id, actor_principal, verified_spiffe_identity, roles, permissions, action, permission, target_type, target_id, reason, outcome, request_id, correlation_id, occurred_at]
      additionalProperties: false
      properties:
        audit_event_id: {type: string, format: uuid}
        action_id: {type: string, format: uuid}
        actor_principal: {type: string, maxLength: 64}
        verified_spiffe_identity: {type: string, pattern: '^spiffe://'}
        roles: {type: array, items: {type: string, enum: [support_readonly, operations, security, finance_readonly]}}
        permissions: {type: array, items: {type: string, maxLength: 64}}
        action: {type: string}
        permission: {type: string}
        target_type: {type: string}
        target_id: {type: string, format: uuid}
        reason: {type: string, minLength: 3, maxLength: 512}
        outcome: {type: string, enum: [accepted, attempted, retrying, outcome_unknown, succeeded, failed]}
        error_code: {type: string, maxLength: 64}
        request_id: {type: string, maxLength: 128}
        correlation_id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
