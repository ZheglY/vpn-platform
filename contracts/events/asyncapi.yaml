    BillingPaymentSucceededData:
      type: object
      required: [payment_id, order_id, user_id, plan_id, amount_minor, currency, paid_at]
      additionalProperties: false
      properties:
        payment_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        plan_id:
          type: string
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        paid_at:
          type: string
          format: date-time
    BillingPaymentCanceledData:
      type: object
      required: [payment_id, order_id, user_id, canceled_at]
      additionalProperties: false
      properties:
        payment_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        canceled_at:
          type: string
          format: date-time
        reason_code:
          type: string
          maxLength: 64
    BillingRefundSucceededData:
      type: object
      required: [refund_id, payment_id, order_id, user_id, amount_minor, currency, refund_scope, refunded_at]
      additionalProperties: false
      properties:
        refund_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        refund_scope:
          type: string
          const: full
        refunded_at:
          type: string
          format: date-time
    SubscriptionPeriodData:
      type: object
      required:
        - subscription_id
        - user_id
        - period_id
        - source_order_id
        - source_payment_id
        - period_start
        - period_end
        - grace_ends_at
      additionalProperties: false
      properties:
        subscription_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        period_id:
          type: string
          format: uuid
        source_order_id:
          type: string
          format: uuid
        source_payment_id:
          type: string
          format: uuid
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        grace_ends_at:
          type: string
          format: date-time
    SubscriptionGraceStartedData:
      type: object
      required: [subscription_id, user_id, period_end, grace_ends_at, effective_at]
      additionalProperties: false
      properties:
        subscription_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        period_end:
          type: string
          format: date-time
        grace_ends_at:
          type: string
          format: date-time
        effective_at:
          type: string
          format: date-time
    SubscriptionTerminalData:
      type: object
