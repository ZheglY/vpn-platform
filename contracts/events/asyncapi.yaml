asyncapi: 3.1.0
info:
  title: VPN Subscription Platform Events
  version: 0.7.0-stage7
  description: >
    Stage 7 event contract. Notification-service consumes normalized, ordered,
    secret-free user facts while existing provisioning contracts remain stable.
defaultContentType: application/json
channels:
  billing.payment.succeeded.v1:
    address: billing.payment.succeeded.v1
    x-contract-status: implemented-stage3
    messages:
      paymentSucceeded:
        $ref: '#/components/messages/BillingPaymentSucceededV1'
  billing.payment.canceled.v1:
    address: billing.payment.canceled.v1
    x-contract-status: implemented-stage3
    messages:
      paymentCanceled:
        $ref: '#/components/messages/BillingPaymentCanceledV1'
  billing.refund.succeeded.v1:
    address: billing.refund.succeeded.v1
    x-contract-status: consumed-stage4-producer-pending
    messages:
      refundSucceeded:
        $ref: '#/components/messages/BillingRefundSucceededV1'
  subscription.activated.v1:
    address: subscription.activated.v1
    x-contract-status: implemented-stage4
    messages:
      subscriptionActivated:
        $ref: '#/components/messages/SubscriptionActivatedV1'
  subscription.extended.v1:
    address: subscription.extended.v1
    x-contract-status: implemented-stage4
    messages:
      subscriptionExtended:
        $ref: '#/components/messages/SubscriptionExtendedV1'
  subscription.grace.started.v1:
    address: subscription.grace.started.v1
    x-contract-status: implemented-stage7
    messages:
      subscriptionGraceStarted:
        $ref: '#/components/messages/SubscriptionGraceStartedV1'
  subscription.expired.v1:
    address: subscription.expired.v1
    x-contract-status: implemented-stage4
    messages:
      subscriptionExpired:
        $ref: '#/components/messages/SubscriptionExpiredV1'
  subscription.revoked.v1:
    address: subscription.revoked.v1
    x-contract-status: implemented-stage4
    messages:
      subscriptionRevoked:
        $ref: '#/components/messages/SubscriptionRevokedV1'
  access.provision.request.v1:
    address: access.provision.request.v1
    x-contract-status: implemented-stage5
    messages:
      provisionRequest:
        $ref: '#/components/messages/AccessProvisionRequestV1'
  access.revoke.request.v1:
    address: access.revoke.request.v1
    x-contract-status: implemented-stage5
    messages:
      revokeRequest:
        $ref: '#/components/messages/AccessRevokeRequestV1'
  access.provision.request.v1.dlq:
    address: access.provision.request.v1.dlq
    x-contract-status: implemented-stage6
    messages:
      provisionRequestDeadLetter:
        $ref: '#/components/messages/AccessProvisionRequestDeadLetterV1'
  access.revoke.request.v1.dlq:
    address: access.revoke.request.v1.dlq
    x-contract-status: implemented-stage6
    messages:
      revokeRequestDeadLetter:
        $ref: '#/components/messages/AccessRevokeRequestDeadLetterV1'
  access.provision.succeeded.v1:
    address: access.provision.succeeded.v1
    x-contract-status: implemented-stage6
    messages:
      provisionSucceeded:
        $ref: '#/components/messages/AccessProvisionSucceededV1'
  access.provision.failed.v1:
    address: access.provision.failed.v1
    x-contract-status: implemented-stage6
    messages:
      provisionFailed:
        $ref: '#/components/messages/AccessProvisionFailedV1'
  access.revoke.succeeded.v1:
    address: access.revoke.succeeded.v1
    x-contract-status: implemented-stage6
    messages:
      revokeSucceeded:
        $ref: '#/components/messages/AccessRevokeSucceededV1'
  access.revoke.failed.v1:
    address: access.revoke.failed.v1
    x-contract-status: implemented-stage6
    messages:
      revokeFailed:
        $ref: '#/components/messages/AccessRevokeFailedV1'
  access.ready.v1:
    address: access.ready.v1
    x-contract-status: implemented-stage5
    messages:
      accessReady:
        $ref: '#/components/messages/AccessReadyV1'
  access.provisioning.failed.v1:
    address: access.provisioning.failed.v1
    x-contract-status: implemented-stage7
    messages:
      accessProvisioningFailed:
        $ref: '#/components/messages/AccessProvisioningFailedV1'
  access.revoked.v1:
    address: access.revoked.v1
    x-contract-status: implemented-stage7
    messages:
      accessRevoked:
        $ref: '#/components/messages/AccessRevokedV1'
operations:
  publishBillingPaymentSucceeded:
    action: send
    channel:
      $ref: '#/channels/billing.payment.succeeded.v1'
    summary: billing-service publishes verified payment success.
  consumeBillingPaymentSucceeded:
    action: receive
    channel:
      $ref: '#/channels/billing.payment.succeeded.v1'
    summary: subscription-service consumes payment success through a durable inbox.
    x-contract-status: implemented-stage4
  consumeBillingRefundSucceeded:
    action: receive
    channel:
      $ref: '#/channels/billing.refund.succeeded.v1'
    summary: subscription-service consumes provider-verified full refund success through a durable inbox.
    x-contract-status: implemented-stage4-consumer
  publishSubscriptionActivated:
    action: send
    channel:
      $ref: '#/channels/subscription.activated.v1'
    summary: subscription-service publishes entitlement activation; VPN access may still be unavailable.
  publishSubscriptionExtended:
    action: send
    channel:
      $ref: '#/channels/subscription.extended.v1'
    summary: subscription-service publishes an appended immutable entitlement period.
  publishSubscriptionGraceStarted:
    action: send
    channel:
      $ref: '#/channels/subscription.grace.started.v1'
    summary: subscription-service publishes the exact active-to-grace transition.
  publishSubscriptionExpired:
    action: send
    channel:
      $ref: '#/channels/subscription.expired.v1'
    summary: subscription-service publishes terminal entitlement expiry.
  publishSubscriptionRevoked:
    action: send
    channel:
      $ref: '#/channels/subscription.revoked.v1'
    summary: subscription-service publishes terminal refund revocation or a temporary refund-gap revocation before a future period.
  publishBillingPaymentCanceled:
    action: send
    channel:
      $ref: '#/channels/billing.payment.canceled.v1'
    summary: billing-service publishes a provider-verified payment cancellation.
  publishAccessProvisionRequest:
    action: send
    channel:
      $ref: '#/channels/access.provision.request.v1'
    summary: access-service requests provisioning without sending credential material.
  consumeAccessProvisionRequest:
    action: receive
    channel:
      $ref: '#/channels/access.provision.request.v1'
    summary: provisioning-service owns provisioning commands and fetches material over mTLS.
    x-contract-status: implemented-stage6
  publishAccessProvisionRequestDeadLetter:
    action: send
    channel:
      $ref: '#/channels/access.provision.request.v1.dlq'
    summary: provisioning-service publishes sanitized poison-record coordinates and hash only.
    x-contract-status: implemented-stage6
  publishAccessRevokeRequestDeadLetter:
    action: send
    channel:
      $ref: '#/channels/access.revoke.request.v1.dlq'
    summary: provisioning-service publishes sanitized poison-record coordinates and hash only.
    x-contract-status: implemented-stage6
  consumeAccessProvisionSucceeded:
    action: receive
    channel:
      $ref: '#/channels/access.provision.succeeded.v1'
    summary: access-service stores the public endpoint snapshot and marks current access ready.
    x-contract-status: implemented-stage5
  consumeAccessProvisionFailed:
    action: receive
    channel:
      $ref: '#/channels/access.provision.failed.v1'
    summary: access-service records a terminal provisioning failure without exposing provider details.
    x-contract-status: implemented-stage5
  consumeAccessRevokeSucceeded:
    action: receive
    channel:
      $ref: '#/channels/access.revoke.succeeded.v1'
    summary: access-service records confirmed physical revocation.
    x-contract-status: implemented-stage5
  consumeAccessRevokeFailed:
    action: receive
    channel:
      $ref: '#/channels/access.revoke.failed.v1'
    summary: access-service preserves revoking state for operator reconciliation.
    x-contract-status: implemented-stage5
  publishAccessReady:
    action: send
    channel:
      $ref: '#/channels/access.ready.v1'
    summary: access-service announces VPN access can now be delivered to the user.
    x-contract-status: implemented-stage5
  publishAccessProvisioningFailed:
    action: send
    channel:
      $ref: '#/channels/access.provisioning.failed.v1'
    summary: access-service publishes a user-safe terminal provisioning failure fact.
    x-contract-status: implemented-stage7
  publishAccessRevoked:
    action: send
    channel:
      $ref: '#/channels/access.revoked.v1'
    summary: access-service publishes physical revoke completion without credential or node details.
    x-contract-status: implemented-stage7
components:
  messages:
    BillingPaymentSucceededV1:
      name: billing.payment.succeeded.v1
      title: Billing payment succeeded
      payload:
        $ref: '#/components/schemas/BillingPaymentSucceededEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: billing-service
      x-contract-status: implemented-stage3
      x-json-schema: schemas/billing.payment.succeeded.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [subscription-service]
      x-retry: durable outbox retry with exponential backoff capped at five minutes
      x-dlq-policy: Stage 3 never discards an unpublished payment event; exhausted or poison records remain visible in the outbox for operator reconciliation. A Kafka DLQ is deferred until a consumer exists.
    BillingPaymentCanceledV1:
      name: billing.payment.canceled.v1
      payload:
        $ref: '#/components/schemas/BillingPaymentCanceledEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: billing-service
      x-contract-status: implemented-stage3
      x-json-schema: schemas/billing.payment.canceled.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [notification-service]
      x-retry: durable outbox retry with exponential backoff capped at five minutes
      x-dlq-policy: Stage 3 never discards an unpublished payment event; exhausted or poison records remain visible in the outbox for operator reconciliation. A Kafka DLQ is deferred until a consumer exists.
    BillingRefundSucceededV1:
      name: billing.refund.succeeded.v1
      payload:
        $ref: '#/components/schemas/BillingRefundSucceededEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: billing-service
      x-contract-status: consumed-stage4-producer-pending
      x-json-schema: schemas/billing.refund.succeeded.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [subscription-service, notification-service]
      x-retry: subscription-service retries transient processing without committing the Kafka offset
      x-dlq-policy: poison records are stored as payload-free consumer dead-letter metadata and their offsets are committed
    SubscriptionActivatedV1:
      name: subscription.activated.v1
      title: Entitlement activated, VPN not necessarily ready
      payload:
        $ref: '#/components/schemas/SubscriptionActivatedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: subscription-service
      x-contract-status: implemented-stage4
      x-json-schema: schemas/subscription.activated.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [access-service, notification-service]
      x-retry: durable outbox retry with exponential backoff capped at five minutes
      x-dlq-policy: unpublished records remain durable and operator-visible in the subscription outbox
      x-ordering: aggregate_sequence is subscription-owned; Access defers and retries gaps without committing the later offset
      x-notification-rule: Do not tell the user that VPN is ready from this event.
    SubscriptionExtendedV1:
      name: subscription.extended.v1
      title: Entitlement extended, VPN not necessarily ready
      payload:
        $ref: '#/components/schemas/SubscriptionExtendedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: subscription-service
      x-contract-status: implemented-stage4
      x-json-schema: schemas/subscription.extended.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [access-service, notification-service]
      x-retry: durable outbox retry with exponential backoff capped at five minutes
      x-dlq-policy: unpublished records remain durable and operator-visible in the subscription outbox
      x-ordering: aggregate_sequence is subscription-owned; Access defers and retries gaps without committing the later offset
    SubscriptionExpiredV1:
      name: subscription.expired.v1
      payload:
        $ref: '#/components/schemas/SubscriptionExpiredEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: subscription-service
      x-contract-status: implemented-stage4
      x-json-schema: schemas/subscription.expired.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [access-service, notification-service]
      x-retry: durable outbox retry with exponential backoff capped at five minutes
      x-dlq-policy: unpublished records remain durable and operator-visible in the subscription outbox
      x-ordering: aggregate_sequence is subscription-owned; Access defers and retries gaps without committing the later offset
    SubscriptionGraceStartedV1:
      name: subscription.grace.started.v1
      title: Subscription grace period started
      payload:
        $ref: '#/components/schemas/SubscriptionGraceStartedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: subscription-service
      x-contract-status: implemented-stage7
      x-json-schema: schemas/subscription.grace.started.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [access-service, notification-service]
      x-retry: durable outbox retry with exponential backoff capped at five minutes
      x-dlq-policy: unpublished records remain durable and operator-visible in the subscription outbox
      x-ordering: aggregate_sequence is subscription-owned across every lifecycle topic; consumers defer gaps without committing the later offset
    SubscriptionRevokedV1:
      name: subscription.revoked.v1
      payload:
        $ref: '#/components/schemas/SubscriptionRevokedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: subscription-service
      x-contract-status: implemented-stage4
      x-json-schema: schemas/subscription.revoked.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [access-service, notification-service]
      x-retry: durable outbox retry with exponential backoff capped at five minutes
      x-dlq-policy: unpublished records remain durable and operator-visible in the subscription outbox
      x-ordering: aggregate_sequence is subscription-owned; Access defers and retries gaps without committing the later offset
    AccessProvisionRequestV1:
      name: access.provision.request.v1
      title: Access provision request
      payload:
        $ref: '#/components/schemas/AccessProvisionRequestEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^credential:[0-9a-fA-F-]{36}$'
      x-owner: access-service
      x-contract-status: implemented-stage5
      x-json-schema: schemas/access.provision.request.v1.schema.json
      x-partition-key: credential:{credential_id}
      x-consumers: [provisioning-service]
      x-command-timeout: PT60S
      x-retry: bounded exponential backoff with jitter until terminal failure
      x-dlq: access.provision.request.v1.dlq
      x-terminal-failure: primary node failed or operation exhausted retries
      x-secret-policy: No VLESS UUID, subscription token, or node private key in Kafka.
      x-ordering: aggregate_sequence equals desired_revision and is credential-owned across provision and revoke commands; provisioning rejects mismatch, gaps, and stale values
    AccessRevokeRequestV1:
      name: access.revoke.request.v1
      payload:
        $ref: '#/components/schemas/AccessRevokeRequestEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^credential:[0-9a-fA-F-]{36}$'
      x-owner: access-service
      x-contract-status: implemented-stage5
      x-json-schema: schemas/access.revoke.request.v1.schema.json
      x-partition-key: credential:{credential_id}
      x-consumers: [provisioning-service]
      x-command-timeout: PT60S
      x-retry: retry until removed from all assigned nodes or terminal escalation
      x-dlq: access.revoke.request.v1.dlq
      x-ordering: aggregate_sequence equals desired_revision and is credential-owned across provision and revoke commands; provisioning rejects mismatch, gaps, and stale values
    AccessProvisionRequestDeadLetterV1:
      name: access.provision.request.v1.dlq
      payload:
        $ref: 'contracts/events/schemas/access.provision.request.v1.dlq.schema.json'
      bindings:
        kafka:
          key:
            type: string
            const: source:access.provision.request.v1
      x-owner: provisioning-service
      x-contract-status: implemented-stage6
      x-json-schema: schemas/access.provision.request.v1.dlq.schema.json
      x-secret-policy: Raw Kafka payload is never copied to the DLQ notice or logs.
      x-replay: Operator supplies source topic, partition, and offset; replay verifies the stored SHA-256 before republishing.
    AccessRevokeRequestDeadLetterV1:
      name: access.revoke.request.v1.dlq
      payload:
        $ref: 'contracts/events/schemas/access.revoke.request.v1.dlq.schema.json'
      bindings:
        kafka:
          key:
            type: string
            const: source:access.revoke.request.v1
      x-owner: provisioning-service
      x-contract-status: implemented-stage6
      x-json-schema: schemas/access.revoke.request.v1.dlq.schema.json
      x-secret-policy: Raw Kafka payload is never copied to the DLQ notice or logs.
      x-replay: Operator supplies source topic, partition, and offset; replay verifies the stored SHA-256 before republishing.
    AccessProvisionSucceededV1:
      name: access.provision.succeeded.v1
      payload:
        $ref: '#/components/schemas/AccessProvisionSucceededEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^credential:[0-9a-fA-F-]{36}$'
      x-owner: provisioning-service
      x-contract-status: implemented-stage6
      x-json-schema: schemas/access.provision.succeeded.v1.schema.json
      x-partition-key: credential:{credential_id}
      x-consumers: [access-service]
      x-ordering: aggregate_sequence is provisioning-owned across all four outcome topics; Access defers gaps without committing them
      x-assignment-proof: assigned_node_ids is the complete allocation; endpoints contains only usable profile endpoints
    AccessProvisionFailedV1:
      name: access.provision.failed.v1
      payload:
        $ref: '#/components/schemas/AccessProvisionFailedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^credential:[0-9a-fA-F-]{36}$'
      x-owner: provisioning-service
      x-contract-status: implemented-stage6
      x-json-schema: schemas/access.provision.failed.v1.schema.json
      x-partition-key: credential:{credential_id}
      x-consumers: [access-service, ops]
      x-ordering: aggregate_sequence is provisioning-owned across all four outcome topics; Access defers gaps without committing them
    AccessRevokeSucceededV1:
      name: access.revoke.succeeded.v1
      payload:
        $ref: '#/components/schemas/AccessRevokeSucceededEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^credential:[0-9a-fA-F-]{36}$'
      x-owner: provisioning-service
      x-contract-status: implemented-stage6
      x-json-schema: schemas/access.revoke.succeeded.v1.schema.json
      x-partition-key: credential:{credential_id}
      x-consumers: [access-service, notification-service]
      x-terminal-proof: desired_revision and allocation_revision must match and node_ids must exactly cover all assigned nodes; an empty unique set confirms zero allocations
      x-ordering: aggregate_sequence is provisioning-owned across all four outcome topics; Access defers gaps without committing them
    AccessRevokeFailedV1:
      name: access.revoke.failed.v1
      payload:
        $ref: '#/components/schemas/AccessRevokeFailedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^credential:[0-9a-fA-F-]{36}$'
      x-owner: provisioning-service
      x-contract-status: implemented-stage6
      x-json-schema: schemas/access.revoke.failed.v1.schema.json
      x-partition-key: credential:{credential_id}
      x-consumers: [access-service, ops]
      x-terminal-failure: failed after bounded retries; requires operator escalation and reconciliation
      x-ordering: aggregate_sequence is provisioning-owned across all four outcome topics; Access defers gaps without committing them
    AccessReadyV1:
      name: access.ready.v1
      title: VPN access is ready for user delivery
      payload:
        $ref: '#/components/schemas/AccessReadyEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: access-service
      x-contract-status: implemented-stage5
      x-json-schema: schemas/access.ready.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [notification-service, telegram-bot]
      x-secret-policy: This event never contains the subscription URL or token.
      x-ordering: aggregate_sequence is credential-owned; consumers must reject stale readiness after a later command or state
    AccessProvisioningFailedV1:
      name: access.provisioning.failed.v1
      title: User-facing access provisioning failed
      payload:
        $ref: '#/components/schemas/AccessProvisioningFailedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: access-service
      x-contract-status: implemented-stage7
      x-json-schema: schemas/access.provisioning.failed.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [notification-service]
      x-secret-policy: No node IDs, provider diagnostics, URL, token, UUID credential, or ciphertext.
      x-ordering: aggregate_sequence is credential-owned across Access facts
    AccessRevokedV1:
      name: access.revoked.v1
      title: User access was physically revoked
      payload:
        $ref: '#/components/schemas/AccessRevokedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: access-service
      x-contract-status: implemented-stage7
      x-json-schema: schemas/access.revoked.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [notification-service]
      x-secret-policy: No node assignment, URL, token, UUID credential, or ciphertext.
      x-ordering: aggregate_sequence is credential-owned across Access facts
  schemas:
    Envelope:
      type: object
      required:
        - event_id
        - event_type
        - schema_version
        - occurred_at
        - producer
        - correlation_id
        - aggregate_type
        - aggregate_id
        - partition_key
        - data
      additionalProperties: false
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        schema_version:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
        producer:
          type: string
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type:
            - string
            - 'null'
          format: uuid
        aggregate_type:
          type: string
        aggregate_id:
          type: string
          format: uuid
        aggregate_sequence:
          type: integer
          minimum: 1
          description: Producer-owned monotonic sequence, required by ordered aggregate message contracts.
        partition_key:
          type: string
        data:
          type: object
          additionalProperties: true
    BillingPaymentSucceededEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: billing.payment.succeeded.v1
            producer:
              const: billing-service
            aggregate_type:
              const: payment
            partition_key:
              pattern: '^user:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/BillingPaymentSucceededData'
    BillingPaymentCanceledEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: billing.payment.canceled.v1
            producer:
              const: billing-service
            aggregate_type:
              const: payment
            partition_key:
              pattern: '^user:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/BillingPaymentCanceledData'
    BillingRefundSucceededEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: billing.refund.succeeded.v1
            producer:
              const: billing-service
            aggregate_type:
              const: refund
            partition_key:
