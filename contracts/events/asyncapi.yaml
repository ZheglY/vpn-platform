        reason_code:
          type: string
          maxLength: 64
          description: Redacted machine-readable reason code.
        pending_node_ids:
          type: array
          items:
            type: string
            format: uuid
        failed_at:
          type: string
          format: date-time
    AccessReadyData:
      type: object
