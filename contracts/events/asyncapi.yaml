asyncapi: 3.1.0
info:
  title: VPN Subscription Platform Events
  version: 0.5.0-stage5
  description: >
    Stage 5 event contract. Access-service consumes subscription lifecycle and
    provisioning outcome events through a durable inbox, and emits secret-free
    provisioning commands and readiness facts through a transactional outbox.
defaultContentType: application/json
channels:
  billing.payment.succeeded.v1:
    address: billing.payment.succeeded.v1
    x-contract-status: implemented-stage3
    messages:
      paymentSucceeded:
        $ref: '#/components/messages/BillingPaymentSucceededV1'
  billing.payment.canceled.v1:
    address: billing.payment.canceled.v1
    x-contract-status: implemented-stage3
    messages:
      paymentCanceled:
        $ref: '#/components/messages/BillingPaymentCanceledV1'
  billing.refund.succeeded.v1:
    address: billing.refund.succeeded.v1
    x-contract-status: consumed-stage4-producer-pending
    messages:
      refundSucceeded:
        $ref: '#/components/messages/BillingRefundSucceededV1'
  subscription.activated.v1:
    address: subscription.activated.v1
    x-contract-status: implemented-stage4
    messages:
      subscriptionActivated:
        $ref: '#/components/messages/SubscriptionActivatedV1'
  subscription.extended.v1:
    address: subscription.extended.v1
    x-contract-status: implemented-stage4
    messages:
      subscriptionExtended:
        $ref: '#/components/messages/SubscriptionExtendedV1'
  subscription.expired.v1:
    address: subscription.expired.v1
    x-contract-status: implemented-stage4
    messages:
      subscriptionExpired:
        $ref: '#/components/messages/SubscriptionExpiredV1'
  subscription.revoked.v1:
    address: subscription.revoked.v1
    x-contract-status: implemented-stage4
    messages:
      subscriptionRevoked:
        $ref: '#/components/messages/SubscriptionRevokedV1'
  access.provision.request.v1:
    address: access.provision.request.v1
    x-contract-status: implemented-stage5
    messages:
      provisionRequest:
        $ref: '#/components/messages/AccessProvisionRequestV1'
  access.revoke.request.v1:
    address: access.revoke.request.v1
    x-contract-status: implemented-stage5
    messages:
      revokeRequest:
        $ref: '#/components/messages/AccessRevokeRequestV1'
  access.provision.succeeded.v1:
    address: access.provision.succeeded.v1
    x-contract-status: consumed-stage5-producer-pending
    messages:
      provisionSucceeded:
        $ref: '#/components/messages/AccessProvisionSucceededV1'
  access.provision.failed.v1:
    address: access.provision.failed.v1
    x-contract-status: consumed-stage5-producer-pending
    messages:
      provisionFailed:
        $ref: '#/components/messages/AccessProvisionFailedV1'
  access.revoke.succeeded.v1:
    address: access.revoke.succeeded.v1
    x-contract-status: consumed-stage5-producer-pending
    messages:
      revokeSucceeded:
        $ref: '#/components/messages/AccessRevokeSucceededV1'
  access.revoke.failed.v1:
    address: access.revoke.failed.v1
    x-contract-status: consumed-stage5-producer-pending
    messages:
      revokeFailed:
        $ref: '#/components/messages/AccessRevokeFailedV1'
  access.ready.v1:
    address: access.ready.v1
    x-contract-status: implemented-stage5
    messages:
      accessReady:
        $ref: '#/components/messages/AccessReadyV1'
operations:
  publishBillingPaymentSucceeded:
    action: send
    channel:
      $ref: '#/channels/billing.payment.succeeded.v1'
    summary: billing-service publishes verified payment success.
  consumeBillingPaymentSucceeded:
    action: receive
    channel:
      $ref: '#/channels/billing.payment.succeeded.v1'
    summary: subscription-service consumes payment success through a durable inbox.
    x-contract-status: implemented-stage4
  consumeBillingRefundSucceeded:
    action: receive
    channel:
      $ref: '#/channels/billing.refund.succeeded.v1'
    summary: subscription-service consumes provider-verified full refund success through a durable inbox.
    x-contract-status: implemented-stage4-consumer
  publishSubscriptionActivated:
    action: send
    channel:
      $ref: '#/channels/subscription.activated.v1'
    summary: subscription-service publishes entitlement activation; VPN access may still be unavailable.
  publishSubscriptionExtended:
    action: send
    channel:
      $ref: '#/channels/subscription.extended.v1'
    summary: subscription-service publishes an appended immutable entitlement period.
  publishSubscriptionExpired:
    action: send
    channel:
      $ref: '#/channels/subscription.expired.v1'
    summary: subscription-service publishes terminal entitlement expiry.
  publishSubscriptionRevoked:
    action: send
    channel:
      $ref: '#/channels/subscription.revoked.v1'
    summary: subscription-service publishes terminal refund revocation or a temporary refund-gap revocation before a future period.
  publishBillingPaymentCanceled:
    action: send
    channel:
      $ref: '#/channels/billing.payment.canceled.v1'
    summary: billing-service publishes a provider-verified payment cancellation.
  publishAccessProvisionRequest:
    action: send
    channel:
      $ref: '#/channels/access.provision.request.v1'
    summary: access-service requests provisioning without sending credential material.
  consumeAccessProvisionRequest:
    action: receive
    channel:
      $ref: '#/channels/access.provision.request.v1'
    summary: provisioning-service owns provisioning commands and fetches material over mTLS.
    x-contract-status: producer-implemented-consumer-stage6
  consumeAccessProvisionSucceeded:
    action: receive
    channel:
      $ref: '#/channels/access.provision.succeeded.v1'
    summary: access-service stores the public endpoint snapshot and marks current access ready.
    x-contract-status: implemented-stage5
  consumeAccessProvisionFailed:
    action: receive
    channel:
      $ref: '#/channels/access.provision.failed.v1'
    summary: access-service records a terminal provisioning failure without exposing provider details.
    x-contract-status: implemented-stage5
  consumeAccessRevokeSucceeded:
    action: receive
    channel:
      $ref: '#/channels/access.revoke.succeeded.v1'
    summary: access-service records confirmed physical revocation.
    x-contract-status: implemented-stage5
  consumeAccessRevokeFailed:
    action: receive
    channel:
      $ref: '#/channels/access.revoke.failed.v1'
    summary: access-service preserves revoking state for operator reconciliation.
    x-contract-status: implemented-stage5
  publishAccessReady:
    action: send
    channel:
      $ref: '#/channels/access.ready.v1'
    summary: access-service announces VPN access can now be delivered to the user.
    x-contract-status: implemented-stage5
components:
  messages:
    BillingPaymentSucceededV1:
      name: billing.payment.succeeded.v1
      title: Billing payment succeeded
      payload:
        $ref: '#/components/schemas/BillingPaymentSucceededEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: billing-service
      x-contract-status: implemented-stage3
      x-json-schema: schemas/billing.payment.succeeded.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [subscription-service]
      x-retry: durable outbox retry with exponential backoff capped at five minutes
      x-dlq-policy: Stage 3 never discards an unpublished payment event; exhausted or poison records remain visible in the outbox for operator reconciliation. A Kafka DLQ is deferred until a consumer exists.
    BillingPaymentCanceledV1:
      name: billing.payment.canceled.v1
      payload:
        $ref: '#/components/schemas/BillingPaymentCanceledEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: billing-service
      x-contract-status: implemented-stage3
      x-json-schema: schemas/billing.payment.canceled.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [notification-service]
      x-retry: durable outbox retry with exponential backoff capped at five minutes
      x-dlq-policy: Stage 3 never discards an unpublished payment event; exhausted or poison records remain visible in the outbox for operator reconciliation. A Kafka DLQ is deferred until a consumer exists.
    BillingRefundSucceededV1:
      name: billing.refund.succeeded.v1
      payload:
        $ref: '#/components/schemas/BillingRefundSucceededEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: billing-service
      x-contract-status: consumed-stage4-producer-pending
      x-json-schema: schemas/billing.refund.succeeded.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [subscription-service, notification-service]
      x-retry: subscription-service retries transient processing without committing the Kafka offset
      x-dlq-policy: poison records are stored as payload-free consumer dead-letter metadata and their offsets are committed
    SubscriptionActivatedV1:
      name: subscription.activated.v1
      title: Entitlement activated, VPN not necessarily ready
      payload:
        $ref: '#/components/schemas/SubscriptionActivatedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: subscription-service
      x-contract-status: implemented-stage4
      x-json-schema: schemas/subscription.activated.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [access-service]
      x-retry: durable outbox retry with exponential backoff capped at five minutes
      x-dlq-policy: unpublished records remain durable and operator-visible in the subscription outbox
      x-notification-rule: Do not tell the user that VPN is ready from this event.
    SubscriptionExtendedV1:
      name: subscription.extended.v1
      title: Entitlement extended, VPN not necessarily ready
      payload:
        $ref: '#/components/schemas/SubscriptionExtendedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: subscription-service
      x-contract-status: implemented-stage4
      x-json-schema: schemas/subscription.extended.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [access-service]
      x-retry: durable outbox retry with exponential backoff capped at five minutes
      x-dlq-policy: unpublished records remain durable and operator-visible in the subscription outbox
    SubscriptionExpiredV1:
      name: subscription.expired.v1
      payload:
        $ref: '#/components/schemas/SubscriptionExpiredEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: subscription-service
      x-contract-status: implemented-stage4
      x-json-schema: schemas/subscription.expired.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [access-service, notification-service]
      x-retry: durable outbox retry with exponential backoff capped at five minutes
      x-dlq-policy: unpublished records remain durable and operator-visible in the subscription outbox
    SubscriptionRevokedV1:
      name: subscription.revoked.v1
      payload:
        $ref: '#/components/schemas/SubscriptionRevokedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: subscription-service
      x-contract-status: implemented-stage4
      x-json-schema: schemas/subscription.revoked.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [access-service, notification-service]
      x-retry: durable outbox retry with exponential backoff capped at five minutes
      x-dlq-policy: unpublished records remain durable and operator-visible in the subscription outbox
    AccessProvisionRequestV1:
      name: access.provision.request.v1
      title: Access provision request
      payload:
        $ref: '#/components/schemas/AccessProvisionRequestEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^credential:[0-9a-fA-F-]{36}$'
      x-owner: access-service
      x-contract-status: implemented-stage5
      x-json-schema: schemas/access.provision.request.v1.schema.json
      x-partition-key: credential:{credential_id}
      x-consumers: [provisioning-service]
      x-command-timeout: PT60S
      x-retry: bounded exponential backoff with jitter until terminal failure
      x-dlq: access.provision.request.v1.dlq
      x-terminal-failure: primary node failed or operation exhausted retries
      x-secret-policy: No VLESS UUID, subscription token, or node private key in Kafka.
    AccessRevokeRequestV1:
      name: access.revoke.request.v1
      payload:
        $ref: '#/components/schemas/AccessRevokeRequestEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^credential:[0-9a-fA-F-]{36}$'
      x-owner: access-service
      x-contract-status: implemented-stage5
      x-json-schema: schemas/access.revoke.request.v1.schema.json
      x-partition-key: credential:{credential_id}
      x-consumers: [provisioning-service]
      x-command-timeout: PT60S
      x-retry: retry until removed from all assigned nodes or terminal escalation
      x-dlq: access.revoke.request.v1.dlq
    AccessProvisionSucceededV1:
      name: access.provision.succeeded.v1
      payload:
        $ref: '#/components/schemas/AccessProvisionSucceededEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^credential:[0-9a-fA-F-]{36}$'
      x-owner: provisioning-service
      x-contract-status: consumed-stage5-producer-pending
      x-json-schema: schemas/access.provision.succeeded.v1.schema.json
      x-partition-key: credential:{credential_id}
      x-consumers: [access-service]
    AccessProvisionFailedV1:
      name: access.provision.failed.v1
      payload:
        $ref: '#/components/schemas/AccessProvisionFailedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^credential:[0-9a-fA-F-]{36}$'
      x-owner: provisioning-service
      x-contract-status: consumed-stage5-producer-pending
      x-json-schema: schemas/access.provision.failed.v1.schema.json
      x-partition-key: credential:{credential_id}
      x-consumers: [access-service, ops]
    AccessRevokeSucceededV1:
      name: access.revoke.succeeded.v1
      payload:
        $ref: '#/components/schemas/AccessRevokeSucceededEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^credential:[0-9a-fA-F-]{36}$'
      x-owner: provisioning-service
      x-contract-status: consumed-stage5-producer-pending
      x-json-schema: schemas/access.revoke.succeeded.v1.schema.json
      x-partition-key: credential:{credential_id}
      x-consumers: [access-service, notification-service]
    AccessRevokeFailedV1:
      name: access.revoke.failed.v1
      payload:
        $ref: '#/components/schemas/AccessRevokeFailedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^credential:[0-9a-fA-F-]{36}$'
      x-owner: provisioning-service
      x-contract-status: consumed-stage5-producer-pending
      x-json-schema: schemas/access.revoke.failed.v1.schema.json
      x-partition-key: credential:{credential_id}
      x-consumers: [access-service, ops]
      x-terminal-failure: failed after bounded retries; requires operator escalation and reconciliation
    AccessReadyV1:
      name: access.ready.v1
      title: VPN access is ready for user delivery
      payload:
        $ref: '#/components/schemas/AccessReadyEnvelope'
      bindings:
        kafka:
          key:
            type: string
            pattern: '^user:[0-9a-fA-F-]{36}$'
      x-owner: access-service
      x-contract-status: implemented-stage5
      x-json-schema: schemas/access.ready.v1.schema.json
      x-partition-key: user:{user_id}
      x-consumers: [notification-service, telegram-bot]
      x-secret-policy: This event never contains the subscription URL or token.
  schemas:
    Envelope:
      type: object
      required:
        - event_id
        - event_type
        - schema_version
        - occurred_at
        - producer
        - correlation_id
        - aggregate_type
        - aggregate_id
        - partition_key
        - data
      additionalProperties: false
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        schema_version:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
        producer:
          type: string
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type:
            - string
            - 'null'
          format: uuid
        aggregate_type:
          type: string
        aggregate_id:
          type: string
          format: uuid
        partition_key:
          type: string
        data:
          type: object
          additionalProperties: true
    BillingPaymentSucceededEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: billing.payment.succeeded.v1
            producer:
              const: billing-service
            aggregate_type:
              const: payment
            partition_key:
              pattern: '^user:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/BillingPaymentSucceededData'
    BillingPaymentCanceledEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: billing.payment.canceled.v1
            producer:
              const: billing-service
            aggregate_type:
              const: payment
            partition_key:
              pattern: '^user:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/BillingPaymentCanceledData'
    BillingRefundSucceededEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: billing.refund.succeeded.v1
            producer:
              const: billing-service
            aggregate_type:
              const: refund
            partition_key:
              pattern: '^user:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/BillingRefundSucceededData'
    SubscriptionActivatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: subscription.activated.v1
            producer:
              const: subscription-service
            aggregate_type:
              const: subscription
            partition_key:
              pattern: '^user:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/SubscriptionPeriodData'
    SubscriptionExtendedEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: subscription.extended.v1
            producer:
              const: subscription-service
            aggregate_type:
              const: subscription
            partition_key:
              pattern: '^user:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/SubscriptionPeriodData'
    SubscriptionExpiredEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: subscription.expired.v1
            producer:
              const: subscription-service
            aggregate_type:
              const: subscription
            partition_key:
              pattern: '^user:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/SubscriptionTerminalData'
    SubscriptionRevokedEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: subscription.revoked.v1
            producer:
              const: subscription-service
            aggregate_type:
              const: subscription
            partition_key:
              pattern: '^user:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/SubscriptionTerminalData'
    AccessProvisionRequestEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: access.provision.request.v1
            producer:
              const: access-service
            aggregate_type:
              const: credential
            partition_key:
              pattern: '^credential:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/AccessOperationRequestData'
    AccessRevokeRequestEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: access.revoke.request.v1
            producer:
              const: access-service
            aggregate_type:
              const: credential
            partition_key:
              pattern: '^credential:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/AccessOperationRequestData'
    AccessProvisionSucceededEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: access.provision.succeeded.v1
            producer:
              const: provisioning-service
            aggregate_type:
              const: credential
            partition_key:
              pattern: '^credential:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/AccessProvisionSucceededData'
    AccessProvisionFailedEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: access.provision.failed.v1
            producer:
              const: provisioning-service
            aggregate_type:
              const: credential
            partition_key:
              pattern: '^credential:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/AccessOperationFailedData'
    AccessRevokeSucceededEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: access.revoke.succeeded.v1
            producer:
              const: provisioning-service
            aggregate_type:
              const: credential
            partition_key:
              pattern: '^credential:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/AccessRevokeSucceededData'
    AccessRevokeFailedEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: access.revoke.failed.v1
            producer:
              const: provisioning-service
            aggregate_type:
              const: credential
            partition_key:
              pattern: '^credential:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/AccessOperationFailedData'
    AccessReadyEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            event_type:
              const: access.ready.v1
            producer:
              const: access-service
            aggregate_type:
              const: access
            partition_key:
              pattern: '^user:[0-9a-fA-F-]{36}$'
            data:
              $ref: '#/components/schemas/AccessReadyData'
    BillingPaymentSucceededData:
      type: object
      required: [payment_id, order_id, user_id, plan_id, amount_minor, currency, paid_at]
      additionalProperties: false
      properties:
        payment_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        plan_id:
          type: string
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        paid_at:
          type: string
          format: date-time
    BillingPaymentCanceledData:
      type: object
      required: [payment_id, order_id, user_id, canceled_at]
      additionalProperties: false
      properties:
        payment_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        canceled_at:
          type: string
          format: date-time
        reason_code:
          type: string
          maxLength: 64
    BillingRefundSucceededData:
      type: object
      required: [refund_id, payment_id, order_id, user_id, amount_minor, currency, refund_scope, refunded_at]
      additionalProperties: false
      properties:
        refund_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        refund_scope:
          type: string
          const: full
        refunded_at:
          type: string
          format: date-time
    SubscriptionPeriodData:
      type: object
      required:
        - subscription_id
        - user_id
        - period_id
        - source_order_id
        - source_payment_id
        - period_start
        - period_end
        - grace_ends_at
      additionalProperties: false
      properties:
        subscription_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        period_id:
          type: string
          format: uuid
        source_order_id:
          type: string
          format: uuid
        source_payment_id:
          type: string
          format: uuid
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        grace_ends_at:
          type: string
          format: date-time
    SubscriptionTerminalData:
      type: object
      required: [subscription_id, user_id, reason, effective_at]
      additionalProperties: false
      properties:
        subscription_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [expired, refund, refund_gap, admin_block, abuse, deleted]
        affected_period_ids:
          type: array
          items:
            type: string
            format: uuid
        effective_at:
          type: string
          format: date-time
    AccessOperationRequestData:
      type: object
      required: [operation_id, credential_id, desired_revision]
      additionalProperties: false
      properties:
        operation_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        desired_revision:
          type: integer
          minimum: 1
    AccessProvisionSucceededData:
      type: object
      required: [operation_id, credential_id, applied_revision, status, endpoints, applied_at]
      additionalProperties: false
      properties:
        operation_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        applied_revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, degraded]
        endpoints:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/AccessEndpointSnapshot'
        applied_at:
          type: string
          format: date-time
    AccessEndpointSnapshot:
      type: object
      required: [node_id, role, address, port, server_name, reality_public_key, short_id, label]
      additionalProperties: false
      properties:
        node_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [primary, failover]
        address:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        server_name:
          type: string
          minLength: 1
          maxLength: 255
        reality_public_key:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Client-facing REALITY public key only; never a node private key.
        short_id:
          type: string
          pattern: '^(?:[0-9a-fA-F]{2}){0,8}$'
        spider_x:
          type: string
          maxLength: 255
        label:
          type: string
          minLength: 1
          maxLength: 64
    AccessRevokeSucceededData:
      type: object
      required: [operation_id, credential_id, revoked_revision, node_ids, revoked_at]
      additionalProperties: false
      properties:
        operation_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        revoked_revision:
          type: integer
          minimum: 1
        node_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        revoked_at:
          type: string
          format: date-time
    AccessOperationFailedData:
      type: object
      required: [operation_id, credential_id, failed_revision, failure_scope, terminal, reason_code, failed_at]
      additionalProperties: false
      properties:
        operation_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        failed_revision:
          type: integer
          minimum: 1
        failure_scope:
          type: string
          enum: [primary, failover, all, unknown]
        terminal:
          type: boolean
        reason_code:
          type: string
          maxLength: 64
          description: Redacted machine-readable reason code.
        pending_node_ids:
          type: array
          items:
            type: string
            format: uuid
        failed_at:
          type: string
          format: date-time
    AccessReadyData:
      type: object
      required: [subscription_id, credential_id, user_id, provisioning_status, ready_at, link_issuance_required]
      additionalProperties: false
      properties:
        subscription_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        provisioning_status:
          type: string
          enum: [active, degraded]
        ready_at:
          type: string
          format: date-time
        link_issuance_required:
          type: boolean
          const: true
