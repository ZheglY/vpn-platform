      additionalProperties: false
      properties:
        subscription_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [expired, refund, refund_gap, admin_block, abuse, deleted]
        affected_period_ids:
          type: array
          items:
            type: string
            format: uuid
        effective_at:
          type: string
          format: date-time
    AccessOperationRequestData:
      type: object
      required: [operation_id, credential_id, desired_revision]
      additionalProperties: false
      properties:
        operation_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        desired_revision:
          type: integer
          minimum: 1
    AccessProvisionSucceededData:
      type: object
      required: [operation_id, credential_id, applied_revision, status, assigned_node_ids, endpoints, applied_at]
      additionalProperties: false
      properties:
        operation_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        applied_revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, degraded]
        assigned_node_ids:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          description: Complete immutable allocation proof, including nodes without a usable endpoint.
          items:
            type: string
            format: uuid
        endpoints:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/AccessEndpointSnapshot'
        applied_at:
          type: string
          format: date-time
    AccessEndpointSnapshot:
      type: object
      required: [node_id, role, address, port, server_name, reality_public_key, short_id, label]
      additionalProperties: false
      properties:
        node_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [primary, failover]
        address:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        server_name:
          type: string
          minLength: 1
          maxLength: 255
        reality_public_key:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Client-facing REALITY public key only; never a node private key.
        short_id:
          type: string
          pattern: '^(?:[0-9a-fA-F]{2}){0,8}$'
        spider_x:
          type: string
          maxLength: 255
        label:
          type: string
          minLength: 1
          maxLength: 64
    AccessRevokeSucceededData:
      type: object
      required: [operation_id, credential_id, desired_revision, allocation_revision, all_assigned_nodes_removed, node_ids, revoked_at]
      additionalProperties: false
      properties:
        operation_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        desired_revision:
          type: integer
          minimum: 1
        allocation_revision:
          type: integer
          minimum: 0
        all_assigned_nodes_removed:
          const: true
        node_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        revoked_at:
          type: string
          format: date-time
    AccessOperationFailedData:
      type: object
      required: [operation_id, credential_id, failed_revision, failure_scope, terminal, reason_code, failed_at]
      additionalProperties: false
      properties:
        operation_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        failed_revision:
          type: integer
          minimum: 1
        failure_scope:
          type: string
          enum: [primary, failover, all, unknown]
        terminal:
