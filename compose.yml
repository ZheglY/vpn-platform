    image: vpn-service/prometheus:local
    build:
      context: .
      dockerfile: deploy/observability/prometheus/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["obs"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_HTTP_PORT:-9090}:9090"
    volumes:
      - ${PROMETHEUS_CONFIG_FILE:-./deploy/observability/prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/rules:/etc/prometheus/rules:ro
      - mtls-observability:/run/mtls:ro
      - prometheus-data:/prometheus
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://localhost:9090"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      mtls-credentials-verify:
        condition: service_completed_successfully
    networks:
      - backend
      - node-management

