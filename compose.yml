name: vpn-service

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vpn_platform}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/local/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend

  redis:
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    profiles: ["core"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    profiles: ["core"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - backend

  identity-migrate:
    build:
      context: .
      dockerfile: tools/migrate/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://identity_app:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}@postgres:5432/identity_service?sslmode=disable
      MIGRATIONS_DIR: /migrations/identity
      MIGRATION_COMMAND: up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  identity-service:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://identity_app:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}@postgres:5432/identity_service?sslmode=disable
      INTERNAL_AUTH_MODE: mtls
      MTLS_TRUST_DOMAIN: vpn-service
      MTLS_NAMESPACE: local
      SERVER_TLS_CERT_FILE: /run/mtls/identity-service.crt
      SERVER_TLS_KEY_FILE: /run/mtls/identity-service.key
      CLIENT_CA_FILE: /run/mtls/ca.crt
      HEALTHCHECK_CLIENT_CERT_FILE: /run/mtls/identity-health.crt
      HEALTHCHECK_CLIENT_KEY_FILE: /run/mtls/identity-health.key
      HEALTHCHECK_CA_FILE: /run/mtls/ca.crt
    ports:
      - "127.0.0.1:${IDENTITY_HTTP_PORT:-8080}:8080"
    volumes:
      - ./secrets/dev-mtls/ca.crt:/run/mtls/ca.crt:ro
      - ./secrets/dev-mtls/identity-service.crt:/run/mtls/identity-service.crt:ro
      - ./secrets/dev-mtls/identity-service.key:/run/mtls/identity-service.key:ro
      - ./secrets/dev-mtls/identity-health.crt:/run/mtls/identity-health.crt:ro
      - ./secrets/dev-mtls/identity-health.key:/run/mtls/identity-health.key:ro
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    networks:
      - backend

  telegram-bot:
    build:
      context: .
      dockerfile: services/telegram-bot/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_ADDR: ":8081"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_DB: 0
      IDENTITY_BASE_URL: https://identity-service:8080
      IDENTITY_AUTH_MODE: mtls
      IDENTITY_CLIENT_CERT_FILE: /run/mtls/telegram-bot.crt
      IDENTITY_CLIENT_KEY_FILE: /run/mtls/telegram-bot.key
      IDENTITY_SERVER_CA_FILE: /run/mtls/ca.crt
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_BASE_URL: http://telegram-api.invalid
      CONSENT_VERSION: terms-v1
    ports:
      - "127.0.0.1:${TELEGRAM_HTTP_PORT:-8081}:8081"
    volumes:
      - ./secrets/dev-mtls/ca.crt:/run/mtls/ca.crt:ro
      - ./secrets/dev-mtls/telegram-bot.crt:/run/mtls/telegram-bot.crt:ro
      - ./secrets/dev-mtls/telegram-bot.key:/run/mtls/telegram-bot.key:ro
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
