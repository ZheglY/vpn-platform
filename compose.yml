name: vpn-service

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vpn_platform}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD}
      SUBSCRIPTION_DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:?set SUBSCRIPTION_DB_PASSWORD}
      ACCESS_DB_PASSWORD: ${ACCESS_DB_PASSWORD:?set ACCESS_DB_PASSWORD}
      PROVISIONING_DB_PASSWORD: ${PROVISIONING_DB_PASSWORD:?set PROVISIONING_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD}
      ADMIN_MIGRATOR_DB_PASSWORD: ${ADMIN_MIGRATOR_DB_PASSWORD:?set ADMIN_MIGRATOR_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/local/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend

  redis:
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    profiles: ["core"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    profiles: ["core"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - backend

  kafka-init:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    profiles: ["app"]
    command:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic billing.payment.succeeded.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic billing.payment.canceled.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic billing.refund.succeeded.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic subscription.activated.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic subscription.extended.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic subscription.expired.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic subscription.revoked.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.provision.request.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.revoke.request.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.provision.succeeded.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.provision.failed.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.revoke.succeeded.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.revoke.failed.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.ready.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic subscription.grace.started.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.provisioning.failed.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.revoked.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.provision.request.v1.dlq --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.revoke.request.v1.dlq --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  mtls-credentials-init:
    image: vpn-service/credentialstage:local
    build:
      context: .
      dockerfile: tools/credentialstage/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app", "vpn", "obs"]
    user: "0:0"
    command:
      - stage
      - --manifest=/etc/credentialstage/manifest.json
      - --source=/source
      - --destination=/runtime
    volumes:
      - ./deploy/local/credentials/mtls-manifest.json:/etc/credentialstage/manifest.json:ro
      - ./secrets/dev-mtls:/source:ro
      - mtls-identity:/runtime/identity
      - mtls-catalog:/runtime/catalog
      - mtls-billing:/runtime/billing
      - mtls-subscription:/runtime/subscription
      - mtls-access:/runtime/access
      - mtls-provisioning:/runtime/provisioning
      - mtls-node-primary:/runtime/node-primary
      - mtls-node-failover:/runtime/node-failover
      - mtls-notification:/runtime/notification
      - mtls-admin:/runtime/admin
      - mtls-telegram:/runtime/telegram
      - mtls-observability:/runtime/observability
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    network_mode: none
    restart: "no"

  mtls-credentials-verify:
    image: vpn-service/credentialstage:local
    profiles: ["app", "vpn", "obs"]
    user: "65532:65532"
    command:
      - verify
      - --manifest=/etc/credentialstage/manifest.json
      - --destination=/runtime
    volumes:
      - ./deploy/local/credentials/mtls-manifest.json:/etc/credentialstage/manifest.json:ro
      - mtls-identity:/runtime/identity:ro
      - mtls-catalog:/runtime/catalog:ro
      - mtls-billing:/runtime/billing:ro
      - mtls-subscription:/runtime/subscription:ro
      - mtls-access:/runtime/access:ro
      - mtls-provisioning:/runtime/provisioning:ro
      - mtls-node-primary:/runtime/node-primary:ro
      - mtls-node-failover:/runtime/node-failover:ro
      - mtls-notification:/runtime/notification:ro
      - mtls-admin:/runtime/admin:ro
      - mtls-telegram:/runtime/telegram:ro
      - mtls-observability:/runtime/observability:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    restart: "no"
    depends_on:
      mtls-credentials-init:
        condition: service_completed_successfully

  xray-credentials-init:
    image: vpn-service/credentialstage:local
    profiles: ["vpn"]
    user: "0:0"
    command:
      - stage
      - --manifest=/etc/credentialstage/manifest.json
      - --source=/source
      - --destination=/runtime
    volumes:
      - ./deploy/local/credentials/xray-manifest.json:/etc/credentialstage/manifest.json:ro
      - ./secrets/dev-xray:/source:ro
      - xray-provisioning:/runtime/provisioning
      - xray-node-primary:/runtime/node-primary
      - xray-node-failover:/runtime/node-failover
      - xray-camouflage:/runtime/camouflage
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    network_mode: none
    restart: "no"

  xray-credentials-verify:
    image: vpn-service/credentialstage:local
    profiles: ["vpn"]
    user: "65532:65532"
    command:
      - verify
      - --manifest=/etc/credentialstage/manifest.json
      - --destination=/runtime
      - --group=nonroot
    volumes:
      - ./deploy/local/credentials/xray-manifest.json:/etc/credentialstage/manifest.json:ro
      - xray-provisioning:/runtime/provisioning:ro
      - xray-node-primary:/runtime/node-primary:ro
      - xray-node-failover:/runtime/node-failover:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    restart: "no"
    depends_on:
      xray-credentials-init:
        condition: service_completed_successfully

  camouflage-credentials-verify:
    image: vpn-service/credentialstage:local
    profiles: ["vpn"]
    user: "0:0"
    command:
      - verify
      - --manifest=/etc/credentialstage/manifest.json
      - --destination=/runtime
      - --group=camouflage
    volumes:
      - ./deploy/local/credentials/xray-manifest.json:/etc/credentialstage/manifest.json:ro
      - xray-camouflage:/runtime/camouflage:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    restart: "no"
    depends_on:
      xray-credentials-init:
        condition: service_completed_successfully

  identity-migrate:
    image: vpn-service/migrate:local
    build:
      context: .
      dockerfile: tools/migrate/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://identity_app:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}@postgres:5432/identity_service?sslmode=disable
      MIGRATIONS_DIR: /migrations/identity
      MIGRATION_COMMAND: up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  identity-service:
    image: vpn-service/identity-service:local
    build:
      context: .
      dockerfile: services/identity/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://identity_app:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}@postgres:5432/identity_service?sslmode=disable
      INTERNAL_AUTH_MODE: mtls
      MTLS_TRUST_DOMAIN: vpn-service
      MTLS_NAMESPACE: local
      SERVER_TLS_CERT_FILE: /run/mtls/identity-service.crt
      SERVER_TLS_KEY_FILE: /run/mtls/identity-service.key
      CLIENT_CA_FILE: /run/mtls/ca.crt
      HEALTHCHECK_CLIENT_CERT_FILE: /run/mtls/identity-health.crt
      HEALTHCHECK_CLIENT_KEY_FILE: /run/mtls/identity-health.key
      HEALTHCHECK_CA_FILE: /run/mtls/ca.crt
    ports:
      - "127.0.0.1:${IDENTITY_HTTP_PORT:-8080}:8080"
    volumes:
      - mtls-identity:/run/mtls:ro
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      mtls-credentials-verify:
        condition: service_completed_successfully
    networks:
      - backend

  catalog-migrate:
    image: vpn-service/migrate:local
    build:
      context: .
      dockerfile: tools/migrate/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://catalog_app:${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD}@postgres:5432/catalog_service?sslmode=disable
      MIGRATIONS_DIR: /migrations/catalog
      MIGRATION_COMMAND: up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  catalog-seed:
    image: vpn-service/catalog-service:local
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    command: ["seed"]
    profiles: ["app"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://catalog_app:${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD}@postgres:5432/catalog_service?sslmode=disable
      INTERNAL_AUTH_MODE: dev-insecure
      CATALOG_SEED_PLAN_ID: ${CATALOG_SEED_PLAN_ID:-vpn-30d-v1}
      CATALOG_SEED_NAME: ${CATALOG_SEED_NAME:-VPN 30 days}
      CATALOG_SEED_AMOUNT_MINOR: ${CATALOG_SEED_AMOUNT_MINOR:-29900}
      CATALOG_SEED_CURRENCY: ${CATALOG_SEED_CURRENCY:-RUB}
      CATALOG_SEED_REGIONS: ${CATALOG_SEED_REGIONS:-ru-test}
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    networks:
      - backend

  catalog-service:
    image: vpn-service/catalog-service:local
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_ADDR: ":8083"
      DATABASE_URL: postgres://catalog_app:${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD}@postgres:5432/catalog_service?sslmode=disable
      INTERNAL_AUTH_MODE: mtls
      MTLS_TRUST_DOMAIN: vpn-service
      MTLS_NAMESPACE: local
      SERVER_TLS_CERT_FILE: /run/mtls/catalog-service.crt
      SERVER_TLS_KEY_FILE: /run/mtls/catalog-service.key
      CLIENT_CA_FILE: /run/mtls/ca.crt
      HEALTHCHECK_CA_FILE: /run/mtls/ca.crt
    ports:
      - "127.0.0.1:${CATALOG_HTTP_PORT:-8083}:8083"
    volumes:
      - mtls-catalog:/run/mtls:ro
    depends_on:
      catalog-seed:
        condition: service_completed_successfully
      mtls-credentials-verify:
        condition: service_completed_successfully
    networks:
      - backend

  billing-migrate:
    image: vpn-service/migrate:local
    build:
      context: .
      dockerfile: tools/migrate/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://billing_app:${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD}@postgres:5432/billing_service?sslmode=disable
      MIGRATIONS_DIR: /migrations/billing
      MIGRATION_COMMAND: up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  yookassa-api:
    image: vpn-service/fake-yookassa:local
    build:
      context: .
      dockerfile: tools/fake-yookassa/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      HTTP_ADDR: ":8085"
      FAKE_YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-test-shop}
      FAKE_YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:?set YOOKASSA_SECRET_KEY}
    ports:
      - "127.0.0.1:${YOOKASSA_HTTP_PORT:-8085}:8085"
    networks:
      - backend

  billing-service:
    image: vpn-service/billing-service:local
    build:
      context: .
      dockerfile: services/billing/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_ADDR: ":8084"
      DATABASE_URL: postgres://billing_app:${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD}@postgres:5432/billing_service?sslmode=disable
      IDENTITY_BASE_URL: https://identity-service:8080
      CATALOG_BASE_URL: https://catalog-service:8083
      INTERNAL_AUTH_MODE: mtls
      INTERNAL_CLIENT_CERT_FILE: /run/mtls/billing-service.crt
      INTERNAL_CLIENT_KEY_FILE: /run/mtls/billing-service.key
      INTERNAL_SERVER_CA_FILE: /run/mtls/ca.crt
      MTLS_TRUST_DOMAIN: vpn-service
      MTLS_NAMESPACE: local
      SERVER_TLS_CERT_FILE: /run/mtls/billing-service.crt
      SERVER_TLS_KEY_FILE: /run/mtls/billing-service.key
      CLIENT_CA_FILE: /run/mtls/ca.crt
      HEALTHCHECK_CA_FILE: /run/mtls/ca.crt
      YOOKASSA_BASE_URL: http://yookassa-api:8085
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-test-shop}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:?set YOOKASSA_SECRET_KEY}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-https://example.invalid/payment-return}
      KAFKA_BROKERS: kafka:9092
      BILLING_WORKER_POLL_INTERVAL: 250ms
      BILLING_WORKER_RETRY_DELAY: 500ms
    ports:
      - "127.0.0.1:${BILLING_HTTP_PORT:-8084}:8084"
    volumes:
      - mtls-billing:/run/mtls:ro
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
      mtls-credentials-verify:
        condition: service_completed_successfully
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      yookassa-api:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend

  subscription-migrate:
    image: vpn-service/migrate:local
    build:
      context: .
      dockerfile: tools/migrate/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://subscription_app:${SUBSCRIPTION_DB_PASSWORD:?set SUBSCRIPTION_DB_PASSWORD}@postgres:5432/subscription_service?sslmode=disable
      MIGRATIONS_DIR: /migrations/subscription
      MIGRATION_COMMAND: up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  subscription-service:
    image: vpn-service/subscription-service:local
    build:
      context: .
      dockerfile: services/subscription/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_ADDR: ":8086"
      DATABASE_URL: postgres://subscription_app:${SUBSCRIPTION_DB_PASSWORD:?set SUBSCRIPTION_DB_PASSWORD}@postgres:5432/subscription_service?sslmode=disable
      BILLING_BASE_URL: https://billing-service:8084
      INTERNAL_AUTH_MODE: mtls
      INTERNAL_CLIENT_CERT_FILE: /run/mtls/subscription-service.crt
      INTERNAL_CLIENT_KEY_FILE: /run/mtls/subscription-service.key
      INTERNAL_SERVER_CA_FILE: /run/mtls/ca.crt
      MTLS_TRUST_DOMAIN: vpn-service
      MTLS_NAMESPACE: local
      SERVER_TLS_CERT_FILE: /run/mtls/subscription-service.crt
      SERVER_TLS_KEY_FILE: /run/mtls/subscription-service.key
      CLIENT_CA_FILE: /run/mtls/ca.crt
      HEALTHCHECK_CA_FILE: /run/mtls/ca.crt
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONSUMER_GROUP: subscription-service-v1
      SUBSCRIPTION_WORKER_POLL_INTERVAL: 250ms
      SUBSCRIPTION_WORKER_RETRY_DELAY: 500ms
    ports:
      - "127.0.0.1:${SUBSCRIPTION_HTTP_PORT:-8086}:8086"
    volumes:
      - mtls-subscription:/run/mtls:ro
    depends_on:
      subscription-migrate:
        condition: service_completed_successfully
      mtls-credentials-verify:
        condition: service_completed_successfully
      billing-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend

  access-migrate:
    image: vpn-service/migrate:local
    build:
      context: .
      dockerfile: tools/migrate/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://access_app:${ACCESS_DB_PASSWORD:?set ACCESS_DB_PASSWORD}@postgres:5432/access_service?sslmode=disable
      MIGRATIONS_DIR: /migrations/access
      MIGRATION_COMMAND: up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  access-service:
    image: vpn-service/access-service:local
    build:
      context: .
      dockerfile: services/access/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_ADDR: ":8087"
      DATABASE_URL: postgres://access_app:${ACCESS_DB_PASSWORD:?set ACCESS_DB_PASSWORD}@postgres:5432/access_service?sslmode=disable
