name: vpn-service

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vpn_platform}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD}
      SUBSCRIPTION_DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:?set SUBSCRIPTION_DB_PASSWORD}
      ACCESS_DB_PASSWORD: ${ACCESS_DB_PASSWORD:?set ACCESS_DB_PASSWORD}
      PROVISIONING_DB_PASSWORD: ${PROVISIONING_DB_PASSWORD:?set PROVISIONING_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/local/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend

  redis:
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    profiles: ["core"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    profiles: ["core"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - backend

  kafka-init:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    profiles: ["app"]
    command:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic billing.payment.succeeded.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic billing.payment.canceled.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic billing.refund.succeeded.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic subscription.activated.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic subscription.extended.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic subscription.expired.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic subscription.revoked.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.provision.request.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.revoke.request.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.provision.succeeded.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.provision.failed.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.revoke.succeeded.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.revoke.failed.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.ready.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.provision.request.v1.dlq --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic access.revoke.request.v1.dlq --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  identity-migrate:
    image: vpn-service/migrate:local
    build:
      context: .
      dockerfile: tools/migrate/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://identity_app:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}@postgres:5432/identity_service?sslmode=disable
      MIGRATIONS_DIR: /migrations/identity
      MIGRATION_COMMAND: up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  identity-service:
    image: vpn-service/identity-service:local
    build:
      context: .
      dockerfile: services/identity/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://identity_app:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}@postgres:5432/identity_service?sslmode=disable
      INTERNAL_AUTH_MODE: mtls
      MTLS_TRUST_DOMAIN: vpn-service
      MTLS_NAMESPACE: local
      SERVER_TLS_CERT_FILE: /run/mtls/identity-service.crt
      SERVER_TLS_KEY_FILE: /run/mtls/identity-service.key
      CLIENT_CA_FILE: /run/mtls/ca.crt
      HEALTHCHECK_CLIENT_CERT_FILE: /run/mtls/identity-health.crt
      HEALTHCHECK_CLIENT_KEY_FILE: /run/mtls/identity-health.key
      HEALTHCHECK_CA_FILE: /run/mtls/ca.crt
    ports:
      - "127.0.0.1:${IDENTITY_HTTP_PORT:-8080}:8080"
    volumes:
      - ./secrets/dev-mtls/ca.crt:/run/mtls/ca.crt:ro
      - ./secrets/dev-mtls/identity-service.crt:/run/mtls/identity-service.crt:ro
      - ./secrets/dev-mtls/identity-service.key:/run/mtls/identity-service.key:ro
      - ./secrets/dev-mtls/identity-health.crt:/run/mtls/identity-health.crt:ro
      - ./secrets/dev-mtls/identity-health.key:/run/mtls/identity-health.key:ro
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    networks:
      - backend

  catalog-migrate:
    image: vpn-service/migrate:local
    build:
      context: .
      dockerfile: tools/migrate/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://catalog_app:${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD}@postgres:5432/catalog_service?sslmode=disable
      MIGRATIONS_DIR: /migrations/catalog
      MIGRATION_COMMAND: up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  catalog-seed:
    image: vpn-service/catalog-service:local
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    command: ["seed"]
    profiles: ["app"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://catalog_app:${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD}@postgres:5432/catalog_service?sslmode=disable
      INTERNAL_AUTH_MODE: dev-insecure
      CATALOG_SEED_PLAN_ID: ${CATALOG_SEED_PLAN_ID:-vpn-30d-v1}
      CATALOG_SEED_NAME: ${CATALOG_SEED_NAME:-VPN 30 days}
      CATALOG_SEED_AMOUNT_MINOR: ${CATALOG_SEED_AMOUNT_MINOR:-29900}
      CATALOG_SEED_CURRENCY: ${CATALOG_SEED_CURRENCY:-RUB}
      CATALOG_SEED_REGIONS: ${CATALOG_SEED_REGIONS:-ru-test}
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    networks:
      - backend

  catalog-service:
    image: vpn-service/catalog-service:local
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_ADDR: ":8083"
      DATABASE_URL: postgres://catalog_app:${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD}@postgres:5432/catalog_service?sslmode=disable
      INTERNAL_AUTH_MODE: mtls
      MTLS_TRUST_DOMAIN: vpn-service
      MTLS_NAMESPACE: local
      SERVER_TLS_CERT_FILE: /run/mtls/catalog-service.crt
      SERVER_TLS_KEY_FILE: /run/mtls/catalog-service.key
      CLIENT_CA_FILE: /run/mtls/ca.crt
      HEALTHCHECK_CA_FILE: /run/mtls/ca.crt
    ports:
      - "127.0.0.1:${CATALOG_HTTP_PORT:-8083}:8083"
    volumes:
      - ./secrets/dev-mtls/ca.crt:/run/mtls/ca.crt:ro
      - ./secrets/dev-mtls/catalog-service.crt:/run/mtls/catalog-service.crt:ro
      - ./secrets/dev-mtls/catalog-service.key:/run/mtls/catalog-service.key:ro
    depends_on:
      catalog-seed:
        condition: service_completed_successfully
    networks:
      - backend

  billing-migrate:
    image: vpn-service/migrate:local
    build:
      context: .
      dockerfile: tools/migrate/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://billing_app:${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD}@postgres:5432/billing_service?sslmode=disable
      MIGRATIONS_DIR: /migrations/billing
      MIGRATION_COMMAND: up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  yookassa-api:
    image: vpn-service/fake-yookassa:local
    build:
      context: .
      dockerfile: tools/fake-yookassa/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      HTTP_ADDR: ":8085"
      FAKE_YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-test-shop}
      FAKE_YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:?set YOOKASSA_SECRET_KEY}
    ports:
      - "127.0.0.1:${YOOKASSA_HTTP_PORT:-8085}:8085"
    networks:
      - backend

  billing-service:
    image: vpn-service/billing-service:local
    build:
      context: .
      dockerfile: services/billing/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_ADDR: ":8084"
      DATABASE_URL: postgres://billing_app:${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD}@postgres:5432/billing_service?sslmode=disable
      IDENTITY_BASE_URL: https://identity-service:8080
      CATALOG_BASE_URL: https://catalog-service:8083
      INTERNAL_AUTH_MODE: mtls
      INTERNAL_CLIENT_CERT_FILE: /run/mtls/billing-service.crt
      INTERNAL_CLIENT_KEY_FILE: /run/mtls/billing-service.key
      INTERNAL_SERVER_CA_FILE: /run/mtls/ca.crt
      MTLS_TRUST_DOMAIN: vpn-service
      MTLS_NAMESPACE: local
      SERVER_TLS_CERT_FILE: /run/mtls/billing-service.crt
      SERVER_TLS_KEY_FILE: /run/mtls/billing-service.key
      CLIENT_CA_FILE: /run/mtls/ca.crt
      HEALTHCHECK_CA_FILE: /run/mtls/ca.crt
      YOOKASSA_BASE_URL: http://yookassa-api:8085
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-test-shop}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:?set YOOKASSA_SECRET_KEY}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-https://example.invalid/payment-return}
      KAFKA_BROKERS: kafka:9092
      BILLING_WORKER_POLL_INTERVAL: 250ms
      BILLING_WORKER_RETRY_DELAY: 500ms
    ports:
      - "127.0.0.1:${BILLING_HTTP_PORT:-8084}:8084"
    volumes:
      - ./secrets/dev-mtls/ca.crt:/run/mtls/ca.crt:ro
      - ./secrets/dev-mtls/billing-service.crt:/run/mtls/billing-service.crt:ro
      - ./secrets/dev-mtls/billing-service.key:/run/mtls/billing-service.key:ro
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      yookassa-api:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend

  subscription-migrate:
    image: vpn-service/migrate:local
    build:
      context: .
      dockerfile: tools/migrate/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://subscription_app:${SUBSCRIPTION_DB_PASSWORD:?set SUBSCRIPTION_DB_PASSWORD}@postgres:5432/subscription_service?sslmode=disable
      MIGRATIONS_DIR: /migrations/subscription
      MIGRATION_COMMAND: up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  subscription-service:
    image: vpn-service/subscription-service:local
    build:
      context: .
      dockerfile: services/subscription/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_ADDR: ":8086"
      DATABASE_URL: postgres://subscription_app:${SUBSCRIPTION_DB_PASSWORD:?set SUBSCRIPTION_DB_PASSWORD}@postgres:5432/subscription_service?sslmode=disable
      BILLING_BASE_URL: https://billing-service:8084
      INTERNAL_AUTH_MODE: mtls
      INTERNAL_CLIENT_CERT_FILE: /run/mtls/subscription-service.crt
      INTERNAL_CLIENT_KEY_FILE: /run/mtls/subscription-service.key
      INTERNAL_SERVER_CA_FILE: /run/mtls/ca.crt
      MTLS_TRUST_DOMAIN: vpn-service
      MTLS_NAMESPACE: local
      SERVER_TLS_CERT_FILE: /run/mtls/subscription-service.crt
      SERVER_TLS_KEY_FILE: /run/mtls/subscription-service.key
      CLIENT_CA_FILE: /run/mtls/ca.crt
      HEALTHCHECK_CA_FILE: /run/mtls/ca.crt
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONSUMER_GROUP: subscription-service-v1
      SUBSCRIPTION_WORKER_POLL_INTERVAL: 250ms
      SUBSCRIPTION_WORKER_RETRY_DELAY: 500ms
    ports:
      - "127.0.0.1:${SUBSCRIPTION_HTTP_PORT:-8086}:8086"
    volumes:
      - ./secrets/dev-mtls/ca.crt:/run/mtls/ca.crt:ro
      - ./secrets/dev-mtls/subscription-service.crt:/run/mtls/subscription-service.crt:ro
      - ./secrets/dev-mtls/subscription-service.key:/run/mtls/subscription-service.key:ro
    depends_on:
      subscription-migrate:
        condition: service_completed_successfully
      billing-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend

  access-migrate:
    image: vpn-service/migrate:local
    build:
      context: .
      dockerfile: tools/migrate/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://access_app:${ACCESS_DB_PASSWORD:?set ACCESS_DB_PASSWORD}@postgres:5432/access_service?sslmode=disable
      MIGRATIONS_DIR: /migrations/access
      MIGRATION_COMMAND: up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  access-service:
    image: vpn-service/access-service:local
    build:
      context: .
      dockerfile: services/access/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_ADDR: ":8087"
      DATABASE_URL: postgres://access_app:${ACCESS_DB_PASSWORD:?set ACCESS_DB_PASSWORD}@postgres:5432/access_service?sslmode=disable
      INTERNAL_AUTH_MODE: mtls
      MTLS_TRUST_DOMAIN: vpn-service
      MTLS_NAMESPACE: local
      SERVER_TLS_CERT_FILE: /run/mtls/access-service.crt
      SERVER_TLS_KEY_FILE: /run/mtls/access-service.key
      CLIENT_CA_FILE: /run/mtls/ca.crt
      HEALTHCHECK_CA_FILE: /run/mtls/ca.crt
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONSUMER_GROUP: access-service-v1
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_DB: 1
      ACCESS_CREDENTIAL_KEY_VERSION: 1
      ACCESS_CREDENTIAL_KEYS: 1:${ACCESS_CREDENTIAL_KEY_BASE64:?set ACCESS_CREDENTIAL_KEY_BASE64}
      ACCESS_TOKEN_HMAC_KEY_BASE64: ${ACCESS_TOKEN_HMAC_KEY_BASE64:?set ACCESS_TOKEN_HMAC_KEY_BASE64}
      SUBSCRIPTION_PUBLIC_BASE_URL: ${SUBSCRIPTION_PUBLIC_BASE_URL:-https://127.0.0.1:8087}
      HAPP_PROFILE_TITLE: ${HAPP_PROFILE_TITLE:-VPN Platform}
      HAPP_SUPPORT_URL: ${HAPP_SUPPORT_URL:-https://example.invalid/support}
      HAPP_PROFILE_UPDATE_HOURS: 6
      ACCESS_WORKER_POLL_INTERVAL: 250ms
      ACCESS_WORKER_RETRY_DELAY: 500ms
    ports:
      - "127.0.0.1:${ACCESS_HTTP_PORT:-8087}:8087"
    volumes:
      - ./secrets/dev-mtls/ca.crt:/run/mtls/ca.crt:ro
      - ./secrets/dev-mtls/access-service.crt:/run/mtls/access-service.crt:ro
      - ./secrets/dev-mtls/access-service.key:/run/mtls/access-service.key:ro
    depends_on:
      access-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend

  provisioning-migrate:
    image: vpn-service/migrate:local
    build:
      context: .
      dockerfile: tools/migrate/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://provisioning_app:${PROVISIONING_DB_PASSWORD:?set PROVISIONING_DB_PASSWORD}@postgres:5432/provisioning_service?sslmode=disable
      MIGRATIONS_DIR: /migrations/provisioning
      MIGRATION_COMMAND: up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  provisioning-seed:
    image: vpn-service/provisioning-service:local
    build:
      context: .
      dockerfile: services/provisioning/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    command: ["seed"]
    profiles: ["vpn"]
    environment:
      DATABASE_URL: postgres://provisioning_app:${PROVISIONING_DB_PASSWORD:?set PROVISIONING_DB_PASSWORD}@postgres:5432/provisioning_service?sslmode=disable
      PROVISIONING_NODE_SEED_FILE: /run/xray/nodes.json
    volumes:
      - ./secrets/dev-xray/nodes.json:/run/xray/nodes.json:ro
    depends_on:
      provisioning-migrate:
        condition: service_completed_successfully
    networks:
      - backend

  provisioning-service:
    image: vpn-service/provisioning-service:local
    build:
      context: .
      dockerfile: services/provisioning/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["vpn"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_ADDR: ":8088"
      DATABASE_URL: postgres://provisioning_app:${PROVISIONING_DB_PASSWORD:?set PROVISIONING_DB_PASSWORD}@postgres:5432/provisioning_service?sslmode=disable
      ACCESS_BASE_URL: https://access-service:8087
      SUBSCRIPTION_BASE_URL: https://subscription-service:8086
      INTERNAL_CLIENT_CERT_FILE: /run/mtls/provisioning-service.crt
      INTERNAL_CLIENT_KEY_FILE: /run/mtls/provisioning-service.key
      INTERNAL_SERVER_CA_FILE: /run/mtls/ca.crt
      SERVER_TLS_CERT_FILE: /run/mtls/provisioning-service.crt
      SERVER_TLS_KEY_FILE: /run/mtls/provisioning-service.key
      HEALTHCHECK_CA_FILE: /run/mtls/ca.crt
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONSUMER_GROUP: provisioning-service-v1
      PROVISIONING_WORKER_POLL_INTERVAL: 250ms
      PROVISIONING_WORKER_RETRY_DELAY: 500ms
      PROVISIONING_HEALTH_INTERVAL: 5s
      PROVISIONING_HEALTH_STALE_AFTER: 20s
      PROVISIONING_RECONCILIATION_INTERVAL: 10s
    ports:
      - "127.0.0.1:${PROVISIONING_HTTP_PORT:-8088}:8088"
    volumes:
      - ./secrets/dev-mtls/ca.crt:/run/mtls/ca.crt:ro
      - ./secrets/dev-mtls/provisioning-service.crt:/run/mtls/provisioning-service.crt:ro
      - ./secrets/dev-mtls/provisioning-service.key:/run/mtls/provisioning-service.key:ro
    depends_on:
      provisioning-migrate:
        condition: service_completed_successfully
      access-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend
      - node-management

  camouflage:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    profiles: ["vpn"]
    volumes:
      - ./deploy/local/xray/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/dev-xray/camouflage.crt:/run/xray/camouflage.crt:ro
      - ./secrets/dev-xray/camouflage.key:/run/xray/camouflage.key:ro
    networks:
      vpn-data:
        aliases:
          - camouflage.local

  node-agent-primary:
    image: vpn-service/node-agent:local
    build:
      context: .
      dockerfile: services/node-agent/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["vpn"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      NODE_ID: 61000000-0000-4000-8000-000000000001
      NODE_HEALTH_CALLER_IDENTITY: node-health-primary
      NODE_STATE_DIRECTORY: /var/lib/node-agent
      NODE_OPERATION_JOURNAL_LIMIT: 2048
      HTTP_ADDR: ":8443"
      SERVER_TLS_CERT_FILE: /run/mtls/node-agent-primary.crt
      SERVER_TLS_KEY_FILE: /run/mtls/node-agent-primary.key
      CLIENT_CA_FILE: /run/mtls/ca.crt
      MTLS_TRUST_DOMAIN: vpn-service
      MTLS_NAMESPACE: local
      HEALTHCHECK_CLIENT_CERT_FILE: /run/mtls/node-health-primary.crt
      HEALTHCHECK_CLIENT_KEY_FILE: /run/mtls/node-health-primary.key
      HEALTHCHECK_CA_FILE: /run/mtls/ca.crt
      XRAY_BINARY: /usr/local/bin/xray
      XRAY_CONFIG_DIRECTORY: /var/lib/xray
      XRAY_LISTEN_ADDRESS: 0.0.0.0
      XRAY_LISTEN_PORT: 443
      XRAY_REALITY_PRIVATE_KEY_FILE: /run/xray/primary.key
      XRAY_REALITY_TARGET: camouflage.local:443
      XRAY_REALITY_SERVER_NAMES: camouflage.local
      XRAY_REALITY_SHORT_IDS: 0123456789abcdef
    ports:
      - "127.0.0.1:${PRIMARY_NODE_AGENT_HTTP_PORT:-18443}:8443"
      - "127.0.0.1:${PRIMARY_VPN_PORT:-1443}:443"
    volumes:
      - ./secrets/dev-mtls/ca.crt:/run/mtls/ca.crt:ro
      - ./secrets/dev-mtls/node-agent-primary.crt:/run/mtls/node-agent-primary.crt:ro
      - ./secrets/dev-mtls/node-agent-primary.key:/run/mtls/node-agent-primary.key:ro
      - ./secrets/dev-mtls/node-health-primary.crt:/run/mtls/node-health-primary.crt:ro
      - ./secrets/dev-mtls/node-health-primary.key:/run/mtls/node-health-primary.key:ro
      - ./secrets/dev-xray/primary.key:/run/xray/primary.key:ro
      - node-primary-state:/var/lib/node-agent
      - node-primary-xray:/var/lib/xray
    depends_on:
      camouflage:
        condition: service_started
    networks:
      - node-management
      - vpn-data

  node-agent-failover:
    image: vpn-service/node-agent:local
    build:
      context: .
      dockerfile: services/node-agent/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["vpn"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      NODE_ID: 61000000-0000-4000-8000-000000000002
      NODE_HEALTH_CALLER_IDENTITY: node-health-failover
      NODE_STATE_DIRECTORY: /var/lib/node-agent
      NODE_OPERATION_JOURNAL_LIMIT: 2048
      HTTP_ADDR: ":8443"
      SERVER_TLS_CERT_FILE: /run/mtls/node-agent-failover.crt
      SERVER_TLS_KEY_FILE: /run/mtls/node-agent-failover.key
      CLIENT_CA_FILE: /run/mtls/ca.crt
      MTLS_TRUST_DOMAIN: vpn-service
      MTLS_NAMESPACE: local
      HEALTHCHECK_CLIENT_CERT_FILE: /run/mtls/node-health-failover.crt
      HEALTHCHECK_CLIENT_KEY_FILE: /run/mtls/node-health-failover.key
      HEALTHCHECK_CA_FILE: /run/mtls/ca.crt
      XRAY_BINARY: /usr/local/bin/xray
      XRAY_CONFIG_DIRECTORY: /var/lib/xray
      XRAY_LISTEN_ADDRESS: 0.0.0.0
      XRAY_LISTEN_PORT: 443
      XRAY_REALITY_PRIVATE_KEY_FILE: /run/xray/failover.key
      XRAY_REALITY_TARGET: camouflage.local:443
      XRAY_REALITY_SERVER_NAMES: camouflage.local
      XRAY_REALITY_SHORT_IDS: fedcba9876543210
    ports:
      - "127.0.0.1:${FAILOVER_NODE_AGENT_HTTP_PORT:-28443}:8443"
      - "127.0.0.1:${FAILOVER_VPN_PORT:-2443}:443"
    volumes:
      - ./secrets/dev-mtls/ca.crt:/run/mtls/ca.crt:ro
      - ./secrets/dev-mtls/node-agent-failover.crt:/run/mtls/node-agent-failover.crt:ro
      - ./secrets/dev-mtls/node-agent-failover.key:/run/mtls/node-agent-failover.key:ro
      - ./secrets/dev-mtls/node-health-failover.crt:/run/mtls/node-health-failover.crt:ro
      - ./secrets/dev-mtls/node-health-failover.key:/run/mtls/node-health-failover.key:ro
      - ./secrets/dev-xray/failover.key:/run/xray/failover.key:ro
      - node-failover-state:/var/lib/node-agent
      - node-failover-xray:/var/lib/xray
    depends_on:
      camouflage:
        condition: service_started
    networks:
      - node-management
      - vpn-data

  telegram-api:
    image: vpn-service/fake-telegram:local
    build:
      context: .
      dockerfile: tools/fake-telegram/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      HTTP_ADDR: ":8082"
      SEND_MESSAGE_DELAY: ${FAKE_TELEGRAM_SEND_DELAY:-250ms}
    ports:
      - "127.0.0.1:${TELEGRAM_API_HTTP_PORT:-8082}:8082"
    networks:
      - backend

  telegram-bot:
    image: vpn-service/telegram-bot:local
    build:
      context: .
      dockerfile: services/telegram-bot/Dockerfile
      args:
        GO_VERSION: "1.26.5"
    profiles: ["app"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_ADDR: ":8081"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_DB: 0
      IDENTITY_BASE_URL: https://identity-service:8080
      CATALOG_BASE_URL: https://catalog-service:8083
      BILLING_BASE_URL: https://billing-service:8084
      IDENTITY_AUTH_MODE: mtls
      IDENTITY_CLIENT_CERT_FILE: /run/mtls/telegram-bot.crt
      IDENTITY_CLIENT_KEY_FILE: /run/mtls/telegram-bot.key
      IDENTITY_SERVER_CA_FILE: /run/mtls/ca.crt
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_BASE_URL: http://telegram-api:8082
      CONSENT_VERSION: terms-v1
      TERMS_URL: ${TERMS_URL:-https://example.invalid/terms/terms-v1}
    ports:
      - "127.0.0.1:${TELEGRAM_HTTP_PORT:-8081}:8081"
    volumes:
      - ./secrets/dev-mtls/ca.crt:/run/mtls/ca.crt:ro
      - ./secrets/dev-mtls/telegram-bot.crt:/run/mtls/telegram-bot.crt:ro
      - ./secrets/dev-mtls/telegram-bot.key:/run/mtls/telegram-bot.key:ro
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      telegram-api:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge
  node-management:
    driver: bridge
    internal: true
  vpn-data:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  node-primary-state:
  node-primary-xray:
  node-failover-state:
  node-failover-xray:
