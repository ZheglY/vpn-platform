name: release-attest

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-scan-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build, scan, and generate SPDX release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: make release-bundle
      - name: Create canonical release metadata archive
        id: bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          short_commit="${commit:0:12}"
          source_epoch="$(git show -s --format=%ct HEAD)"
          bundle="${RUNNER_TEMP}/vpn-platform-${RELEASE_VERSION}-${short_commit}.tar.gz"
          tar --sort=name --mtime="@${source_epoch}" --owner=0 --group=0 --numeric-owner \
            -C "tmp/release-${short_commit}" -cf - . | gzip -n >"${bundle}"
          echo "path=${bundle}" >>"${GITHUB_OUTPUT}"
      - name: Keyless build provenance attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.bundle.outputs.path }}
      - name: Verify repository-bound attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "${{ steps.bundle.outputs.path }}" --repo "${GITHUB_REPOSITORY}"
      - name: Upload attested release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vpn-platform-${{ inputs.version }}-${{ github.sha }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 30
