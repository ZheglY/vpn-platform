name: verify

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Verify
        run: make verify
      - name: Native Linux credential and 8-target observability smoke
        run: make observability-smoke
      - name: Native Linux credential and 11-target Stage 7 smoke
        run: make stage7-smoke
      - name: Forced-failure backup cleanup and ignored filesystem scan
        run: make backup-cleanup-test filesystem-secret-scan
      - name: Encrypted database-per-service backup and clean restore drill
        run: make backup-restore-drill
      - name: Disposable Debian node hardening and idempotence
        run: make node-hardening-test
      - name: Secret overlap, cutover, and rollback drill
        run: make secret-rotation-drill
      - name: Bounded load and dependency failure recovery drill
        run: make resilience-drill
      - name: Build scanned release inventory and SPDX bundle
        run: make release-bundle
