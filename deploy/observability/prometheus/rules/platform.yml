groups:
  - name: vpn-platform-http
    interval: 30s
    rules:
      - alert: VPNControlPlaneTargetDown
        expr: up{job=~"vpn-control-plane|vpn-provisioning|vpn-nodes"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "VPN platform metrics target is unavailable"
          description: "Prometheus cannot scrape {{ $labels.instance }} in job {{ $labels.job }}."
          runbook_url: "https://github.com/ZheglY/vpn-platform/blob/main/docs/runbooks/observability.md#target-down"

      - alert: VPNControlPlaneTargetInventoryMismatch
        expr: absent(up{job="vpn-control-plane"}) or count(up{job="vpn-control-plane"}) < 8
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "VPN control-plane metrics inventory is incomplete"
          description: "Prometheus has fewer than the eight expected control-plane targets."
          runbook_url: "https://github.com/ZheglY/vpn-platform/blob/main/docs/runbooks/observability.md#target-inventory-mismatch"

      - alert: VPNHTTPServerErrorRatioHigh
        expr: |
          (
            sum by (service) (rate(vpn_platform_http_server_requests_total{status_class="5xx"}[5m]))
            /
            clamp_min(sum by (service) (rate(vpn_platform_http_server_requests_total[5m])), 0.001)
          ) > 0.05
          and
          sum by (service) (rate(vpn_platform_http_server_requests_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "HTTP server error ratio is high for {{ $labels.service }}"
          description: "More than 5% of requests have returned 5xx for ten minutes."
          runbook_url: "https://github.com/ZheglY/vpn-platform/blob/main/docs/runbooks/observability.md#high-http-error-ratio"

      - alert: VPNHTTPServerP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, le) (rate(vpn_platform_http_server_request_duration_seconds_bucket[5m]))
          ) > 0.3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "HTTP p95 latency is high for {{ $labels.service }}"
          description: "Observed p95 server duration exceeds the initial 300 ms control-plane objective."
          runbook_url: "https://github.com/ZheglY/vpn-platform/blob/main/docs/runbooks/observability.md#high-http-latency"
