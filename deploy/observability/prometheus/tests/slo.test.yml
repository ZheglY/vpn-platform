rule_files:
  - /etc/prometheus/rules/slo.yml

evaluation_interval: 1m

tests:
  - name: control API fast burn consumes the 99.9 percent budget
    interval: 1m
    input_series:
      - series: 'vpn_platform_http_server_requests_total{service="identity-service",method="GET",route="GET /internal/v1/users/{user_id}",status_class="2xx"}'
        values: '0+98x75'
      - series: 'vpn_platform_http_server_requests_total{service="identity-service",method="GET",route="GET /internal/v1/users/{user_id}",status_class="5xx"}'
        values: '0+2x75'
    alert_rule_test:
      - eval_time: 65m
        alertname: VPNControlAPIErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: control_api_availability
            exp_annotations:
              summary: "Control API is rapidly consuming its availability budget"
              description: "The 99.9% monthly availability objective is burning at more than 14.4x over both one-hour and five-minute windows."
              runbook_url: "https://github.com/ZheglY/vpn-platform/blob/main/docs/runbooks/observability.md#slo-budget-burn"

  - name: subscription endpoint fast burn consumes the 99.95 percent budget
    interval: 1m
    input_series:
      - series: 'vpn_platform_http_server_requests_total{service="access-service",method="GET",route="GET /s/{token}",status_class="2xx"}'
        values: '0+99x75'
      - series: 'vpn_platform_http_server_requests_total{service="access-service",method="GET",route="GET /s/{token}",status_class="5xx"}'
        values: '0+1x75'
    alert_rule_test:
      - eval_time: 65m
        alertname: VPNSubscriptionEndpointErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: subscription_endpoint_availability
            exp_annotations:
              summary: "Subscription endpoint is rapidly consuming its availability budget"
              description: "The 99.95% monthly availability objective is burning at more than 14.4x over both one-hour and five-minute windows."
              runbook_url: "https://github.com/ZheglY/vpn-platform/blob/main/docs/runbooks/observability.md#slo-budget-burn"

  - name: payment to provisioning fast burn counts only starts over sixty seconds
    interval: 1m
    input_series:
      - series: 'vpn_access_payment_to_provisioning_seconds_count{instance="access-service:8087"}'
        values: '0+100x75'
      - series: 'vpn_access_payment_to_provisioning_seconds_bucket{instance="access-service:8087",le="60"}'
        values: '0+80x75'
    alert_rule_test:
      - eval_time: 65m
        alertname: VPNPaymentProvisioningErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: payment_to_provisioning
            exp_annotations:
              summary: "Payment-to-provisioning latency is rapidly consuming its budget"
              description: "More than the allowed share of initial payments are taking over 60 seconds to create a durable provisioning command."
              runbook_url: "https://github.com/ZheglY/vpn-platform/blob/main/docs/runbooks/observability.md#slo-budget-burn"

  - name: healthy objectives do not page
    interval: 1m
    input_series:
      - series: 'vpn_platform_http_server_requests_total{service="identity-service",method="GET",route="GET /internal/v1/users/{user_id}",status_class="2xx"}'
        values: '0+100x75'
      - series: 'vpn_platform_http_server_requests_total{service="access-service",method="GET",route="GET /s/{token}",status_class="2xx"}'
        values: '0+100x75'
      - series: 'vpn_access_payment_to_provisioning_seconds_count{instance="access-service:8087"}'
        values: '0+100x75'
      - series: 'vpn_access_payment_to_provisioning_seconds_bucket{instance="access-service:8087",le="60"}'
        values: '0+100x75'
    alert_rule_test:
      - eval_time: 65m
        alertname: VPNControlAPIErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 65m
        alertname: VPNSubscriptionEndpointErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 65m
        alertname: VPNPaymentProvisioningErrorBudgetFastBurn
        exp_alerts: []
